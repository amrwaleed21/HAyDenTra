<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAyDenTra® | Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            color: #0f172a;
            background: linear-gradient(180deg, #ffffff 0%, #e0f2fe 50%, #bae6fd 100%);
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: 0.3;
            background-image: radial-gradient(rgba(2, 132, 199, 0.2) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: 0;
        }

        /* LOGIN - شاشة تسجيل الدخول مجمعة في سكشن واحد */

        #loginSection {
            display: none; /* مخفية افتراضياً */
        }

        .login-wrapper {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: min(100%, 430px);
            padding: 35px 30px;
            border-radius: 25px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px) saturate(160%);
            -webkit-backdrop-filter: blur(20px) saturate(160%);
            box-shadow: 0 20px 50px rgba(2, 132, 199, 0.15), inset 0 1px 1px rgba(255, 255, 255, 0.9);
            text-align: center;
        }

        .logo-circle {
            width: 90px;
            height: 90px;
            margin: auto;
            border-radius: 50%;
            background: white;
            display: grid;
            place-items: center;
            box-shadow: 0 0 15px rgba(2, 132, 199, 0.2), 0 0 30px rgba(56, 189, 248, 0.3);
            border: 2px solid #ffffff;
        }

        .logo-circle img {
            width: 72%;
            height: 72%;
            object-fit: contain;
        }

        .brand {
            position: relative;
            display: inline-block;
            margin-top: 15px;
            font-family: Arial, sans-serif;
            font-size: 30px;
            font-weight: 900;
            color: #0284c7;
            direction: ltr;
        }

        .registered {
            position: absolute;
            top: -5px;
            right: -9px;
            font-size: 10px;
        }

        .login-title {
            margin-top: 25px;
            font-size: 22px;
            font-weight: 900;
            color: #0f172a;
        }

        .input {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border-radius: 13px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            color: #0f172a;
            font-family: "Cairo", sans-serif;
            font-weight: 700;
            outline: none;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.05);
            transition: .25s;
        }

        .input:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #0284c7;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.18);
        }

        .input::placeholder {
            color: #64748b;
        }

        .main-btn {
            width: 100%;
            padding: 14px;
            margin-top: 18px;
            border: none;
            border-radius: 13px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            font-family: "Cairo", sans-serif;
            font-weight: 900;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.3);
            transition: .25s;
        }

        .main-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.4);
        }

        .login-home-btn {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border-radius: 13px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            color: #0369a1;
            font-family: "Cairo", sans-serif;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: .25s;
        }

        .login-home-btn:hover {
            background: rgba(224, 242, 254, 0.8);
            border-color: #38bdf8;
            color: #0284c7;
        }

        .error {
            margin-top: 12px;
            color: #e11d48;
            font-size: 13px;
            font-weight: 700;
        }

        /* ADMIN - لوحة الأدمن مجمعة في سكشن واحد */

        #adminDashboard {
            position: relative;
            z-index: 1;
            display: none; /* مخفية افتراضياً */
        }

        .topbar {
            height: 74px;
            background: rgba(255, 255, 255, 0.7);
            border-bottom: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
        }

        .nav-logo {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: white;
            padding: 5px;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.15);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .nav-brand-name {
            position: relative;
            font-family: Arial, sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: #0284c7;
            direction: ltr;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .home-btn,
        .logout-btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            color: #0369a1;
            font-family: "Cairo", sans-serif;
            font-weight: 800;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: .25s;
        }

        .home-btn:hover {
            background: rgba(224, 242, 254, 0.9);
            border-color: #38bdf8;
            color: #0284c7;
        }

        .logout-btn {
            color: #e11d48;
        }

        .logout-btn:hover {
            background: rgba(254, 226, 226, 0.8);
            border-color: #fca5a5;
            color: #be123c;
        }

        .container {
            width: min(100% - 30px, 1000px);
            margin: 30px auto;
        }

        .title {
            text-align: center;
            font-size: 30px;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 25px;
        }

        .panel {
            padding: 24px;
            margin-bottom: 25px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(18px) saturate(160%);
            -webkit-backdrop-filter: blur(18px) saturate(160%);
            box-shadow: 0 15px 35px rgba(2, 132, 199, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        .panel h2 {
            margin-bottom: 18px;
            font-size: 20px;
            font-weight: 900;
            color: #0284c7;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            color: #0369a1;
            font-size: 14px;
            font-weight: 800;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            color: #0f172a;
            font-family: "Cairo", sans-serif;
            font-weight: 700;
            outline: none;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.04);
            transition: .25s;
        }

        input:focus,
        textarea:focus,
        select:focus {
            background: rgba(255, 255, 255, 0.95);
            border-color: #0284c7;
            box-shadow: 0 5px 18px rgba(2, 132, 199, 0.15);
        }

        select option {
            color: #0f172a;
            background: #ffffff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        .save-btn {
            margin-top: 18px;
            padding: 12px 22px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            font-family: "Cairo", sans-serif;
            font-weight: 900;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(2, 132, 199, 0.25);
            transition: .25s;
        }

        .save-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.35);
        }

        .cancel-btn {
            margin-top: 18px;
            padding: 12px 22px;
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.6);
            color: #475569;
            font-family: "Cairo", sans-serif;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            transition: .25s;
        }

        .cancel-btn:hover {
            background: rgba(226, 232, 240, 0.8);
            color: #0f172a;
        }

        .products-list {
            display: grid;
            gap: 14px;
        }

        .product {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 16px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.05);
            transition: .25s;
        }

        .product:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.12);
            background: rgba(255, 255, 255, 0.85);
        }

        .product-img {
            width: 75px;
            height: 75px;
            flex-shrink: 0;
            border-radius: 14px;
            background: #ffffff;
            display: grid;
            place-items: center;
            overflow: hidden;
            border: 1px solid rgba(224, 242, 254, 0.8);
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.08);
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-img i {
            color: #0284c7;
            font-size: 32px;
        }

        .product-info {
            flex: 1;
            min-width: 0;
        }

        .product-name {
            font-weight: 900;
            font-size: 16px;
            color: #0f172a;
        }

        .product-price {
            margin-top: 4px;
            color: #0284c7;
            font-weight: 900;
            font-size: 15px;
        }

        .product-actions {
            display: flex;
            gap: 8px;
        }

        .edit-btn,
        .delete-btn {
            border: none;
            border-radius: 10px;
            padding: 9px 14px;
            font-family: "Cairo", sans-serif;
            font-weight: 800;
            font-size: 13px;
            cursor: pointer;
            transition: .25s;
        }

        .edit-btn {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            box-shadow: 0 3px 10px rgba(2, 132, 199, 0.2);
        }

        .edit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(2, 132, 199, 0.3);
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            box-shadow: 0 3px 10px rgba(239, 68, 68, 0.2);
        }

        .delete-btn:hover {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 5px 12px rgba(239, 68, 68, 0.3);
        }

        .status {
            margin-top: 14px;
            color: #0369a1;
            font-size: 14px;
            font-weight: 800;
        }

        @media(max-width: 600px) {

            .topbar {
                padding: 0 12px;
            }

            .nav-brand {
                gap: 7px;
            }

            .nav-logo {
                width: 42px;
                height: 42px;
            }

            .nav-brand-name {
                font-size: 21px;
            }

            .topbar-actions {
                gap: 5px;
            }

            .home-btn,
            .logout-btn {
                padding: 9px 10px;
                font-size: 12px;
            }

            .home-btn span,
            .logout-btn span {
                display: none;
            }

            .product {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .product-info {
                width: calc(100% - 95px);
            }

            .product-actions {
                width: 100%;
            }

            .edit-btn,
            .delete-btn {
                flex: 1;
            }

        }

    </style>

</head>

<body>

<!-- شاشة تسجيل الدخول المجمعة -->
<div id="loginSection">
    <div class="login-wrapper">

        <div class="login-box">

            <div class="logo-circle">
                <img src="logo.png" alt="HAyDenTra">
            </div>

            <div class="brand">
                HAyDenTra
                <span class="registered">®</span>
            </div>

            <div class="login-title">
                لوحة الإدارة
            </div>

            <input class="input" id="email" type="email" placeholder="البريد الإلكتروني">
            <input class="input" id="password" type="password" placeholder="كلمة المرور">

            <button class="main-btn" onclick="handleLogin()">
                تسجيل الدخول
            </button>

            <a href="index.html" class="login-home-btn">
                <i class="fa-solid fa-house"></i>
                العودة إلى الصفحة الرئيسية
            </a>

            <div class="error" id="loginError"></div>

        </div>

    </div>
</div>

<!-- لوحة الأدمن المجمعة -->
<div id="adminDashboard">

    <header class="topbar">

        <div class="nav-brand">
            <img class="nav-logo" src="logo.png">
            <div class="nav-brand-name">
                HAyDenTra
                <span class="registered">®</span>
            </div>
        </div>

        <div class="topbar-actions">
            <a href="index.html" class="home-btn">
                <i class="fa-solid fa-house"></i>
                <span>الرئيسية</span>
            </a>
            <button class="logout-btn" onclick="handleLogout()">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>خروج</span>
            </button>
        </div>

    </header>

    <main class="container">

        <h1 class="title">إدارة المنتجات</h1>

        <section class="panel">
            <h2 id="formTitle">إضافة منتج جديد</h2>

            <label>اسم المنتج</label>
            <input id="productName" placeholder="مثال: مسكن بندول">

            <label>السعر</label>
            <input id="productPrice" type="number" min="0" placeholder="مثال: 2450">

            <label>التصنيف</label>
            <select id="productCategory">
                <option value="medicines">الأدوية</option>
                <option value="materials">المواد</option>
                <option value="devices">الأجهزة</option>
                <option value="tools">الأدوات</option>
            </select>

            <label>وصف المنتج</label>
            <textarea id="productDescription" placeholder="اكتب وصف المنتج..."></textarea>

            <label>صورة المنتج</label>
            <input id="productImage" type="file" accept="image/*">

            <button class="save-btn" onclick="saveProduct()">
                <i class="fa-solid fa-floppy-disk"></i>
                حفظ المنتج
            </button>

            <button class="cancel-btn" onclick="resetForm()">
                إلغاء
            </button>

            <div class="status" id="status"></div>
        </section>

        <section class="panel">
            <h2>المنتجات الحالية</h2>
            <div class="products-list" id="productsList">
                جاري تحميل المنتجات...
            </div>
        </section>

    </main>

</div>

<script>

const SUPABASE_URL = "https://hcvajgyjiflkcsdjvzib.supabase.co";
const SUPABASE_KEY = "sb_publishable_NhB5QvshhLY4rPpOTLjGXw_dBjCbSOW"; // استخدام مفتاح publishable للفرونت إند

const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let editingId = null;
let oldImageUrl = "";

// سلكتورز مجمعة للسكاشن الكبيرة
const loginSection = document.getElementById("loginSection");
const adminDashboard = document.getElementById("adminDashboard");

/* --- نظام التحقق (AUTH) --- */

// دالة التحقق فور تحميل الصفحة
async function checkInitialAuth() {
    // الحصول على الجلسة الحالية
    const { data: { session } } = await supabaseClient.auth.getSession();

    if (session) {
        // لو مسجل دخول -> اظهر الأدمن
        showAdminPanel();
    } else {
        // لو مش مسجل -> اظهر اللوجن
        showLoginScreen();
    }
}

function showAdminPanel() {
    loginSection.style.display = "none";
    adminDashboard.style.display = "block";
    loadProducts(); // تحميل المنتجات فقط عند عرض اللوحة
}

function showLoginScreen() {
    loginSection.style.display = "block";
    adminDashboard.style.display = "none";
}

// دالة تسجيل الدخول
async function handleLogin() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const errorBox = document.getElementById("loginError");

    errorBox.textContent = ""; // مسح الأخطاء السابقة

    if (!email || !password) {
        errorBox.textContent = "يرجى ملء كافة الحقول.";
        return;
    }

    // محاولة الدخول عبر سوبابيز
    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        errorBox.textContent = "البريد الإلكتروني أو كلمة المرور غير صحيحة.";
        console.error("Login error:", error.message);
        return;
    }

    // نجح الدخول -> اظهر لوحة الأدمن
    showAdminPanel();
}

// دالة تسجيل الخروج
async function handleLogout() {
    await supabaseClient.auth.signOut();
    window.location.reload(); // إعادة تحميل الصفحة للعودة للوجن سكرين
}


/* --- إدارة المنتجات (CRUD) --- */

// تحميل المنتجات
async function loadProducts() {
    const list = document.getElementById("productsList");
    list.innerHTML = "جاري تحميل المنتجات...";

    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        list.innerHTML = "حدث خطأ أثناء تحميل المنتجات.";
        console.error("Fetch error:", error.message);
        return;
    }

    if (!data || data.length === 0) {
        list.innerHTML = "لا توجد منتجات حتى الآن.";
        return;
    }

    list.innerHTML = ""; // مسح جملة التحميل

    data.forEach(product => {
        const item = document.createElement("div");
        item.className = "product";

        // التعامل مع الصورة
        let imageHTML = "";
        if (product.image_url) {
            imageHTML = `<img src="${escapeHTML(product.image_url)}" alt="${escapeHTML(product.name)}">`;
        } else {
            let icon = "fa-tooth"; // ديفولت
            if (product.category === "medicines" || product.category === "medication") icon = "fa-pills";
            if (product.category === "devices") icon = "fa-lightbulb";
            if (product.category === "tools") icon = "fa-toolbox";
            imageHTML = `<i class="fa-solid ${icon}"></i>`;
        }

        item.innerHTML = `
            <div class="product-img">${imageHTML}</div>
            <div class="product-info">
                <div class="product-name">${escapeHTML(product.name)}</div>
                <div class="product-price">${Number(product.price).toLocaleString("en-US")} ج.م</div>
            </div>
            <div class="product-actions">
                <button class="edit-btn" onclick="editProduct(${product.id})">
                    <i class="fa-solid fa-pen"></i> تعديل
                </button>
                <button class="delete-btn" onclick="deleteProduct(${product.id})">
                    <i class="fa-solid fa-trash"></i> حذف
                </button>
            </div>
        `;
        list.appendChild(item);
    });
}

// حفظ المنتج (إضافة أو تعديل)
async function saveProduct() {
    const name = document.getElementById("productName").value.trim();
    const price = Number(document.getElementById("productPrice").value);
    const category = document.getElementById("productCategory").value;
    const description = document.getElementById("productDescription").value.trim();
    const imageFile = document.getElementById("productImage").files[0];
    const status = document.getElementById("status");

    // تحويل السعر من String لـ Number والتأكد منه
    if (!name || isNaN(price) || price < 0) {
        status.textContent = "يرجى إدخال اسم وصفر صحيح للسعر.";
        status.style.color = "red";
        return;
    }

    status.textContent = "جاري الحفظ...";
    status.style.color = "blue";

    // معالجة الصورة (رفع جديد أو استخدام القديمة)
    let imageUrl = oldImageUrl; // افتراضياً نستخدم القديمة لو تعديل

    if (imageFile) {
        // إذا اختار ملف جديد -> نرفعه أولاً
        const { data: authData } = await supabaseClient.auth.getUser();
        if (!authData.user) { status.textContent="انتهت الجلسة، اعد الدخول"; showLoginScreen(); return; }

        const fileExt = imageFile.name.split('.').pop();
        const fileName = `${crypto.randomUUID()}.${fileExt}`; // اسم فريد لمنع التكرار

        // محاولة الرفع لـ Storage Bucket اسمه 'products'
        const { error: uploadError } = await supabaseClient.storage
            .from("products")
            .upload(fileName, imageFile);

        if (uploadError) {
            status.textContent = "فشل رفع الصورة.";
            console.error("Upload error:", uploadError.message);
            return;
        }

        // الحصول على رابط الصورة العلني (Public URL)
        const { data: publicUrlData } = supabaseClient.storage
            .from("products")
            .getPublicUrl(fileName);

        imageUrl = publicUrlData.publicUrl;
    }

    const productData = {
        name: name,
        price: price,
        category: category,
        description: description,
        image_url: imageUrl
    };

    if (editingId) {
        // حالة التعديل
        const { error } = await supabaseClient
            .from("products")
            .update(productData)
            .eq("id", editingId);

        if (error) {
            status.textContent = "حدث خطأ أثناء التعديل.";
            status.style.color = "red";
            console.error("Update error:", error.message);
            return;
        }
        status.textContent = "تم تعديل المنتج بنجاح ✅";
    } else {
        // حالة الإضافة الجديدة
        const { error } = await supabaseClient
            .from("products")
            .insert([productData]);

        if (error) {
            status.textContent = "حدث خطأ أثناء إضافة المنتج.";
            status.style.color = "red";
            console.error("Insert error:", error.message);
            return;
        }
        status.textContent = "تم إضافة المنتج بنجاح ✅";
    }

    status.style.color = "green";
    resetForm();
    loadProducts();
}

// دالة التعديل (تحضير الفورم)
async function editProduct(id) {
    const { data, error } = await supabaseClient
        .from("products")
        .select("*")
        .eq("id", id)
        .single(); // نتوقع منتج واحد فقط

    if (error) {
        alert("حدث خطأ أثناء جلب بيانات المنتج.");
        return;
    }

    editingId = id;
    oldImageUrl = data.image_url || ""; // حفظ الرابط القديم للاستخدام لو لم يتم تغيير الصورة

    document.getElementById("productName").value = data.name;
    document.getElementById("productPrice").value = data.price;
    document.getElementById("productCategory").value = data.category;
    document.getElementById("productDescription").value = data.description || "";
    document.getElementById("productImage").value = ""; // مسح الفايل إنبوت القديم

    document.getElementById("formTitle").textContent = "تعديل المنتج";
    
    // سكرول لأعلى لرؤية الفورم
    window.scrollTo({ top: 0, behavior: "smooth" });
}

// حذف المنتج
async function deleteProduct(id) {
    const confirmed = confirm("هل أنت متأكد من حذف هذا المنتج؟ لا يمكن التراجع عن هذه الخطوة.");
    if (!confirmed) return;

    const { error } = await supabaseClient
        .from("products")
        .delete()
        .eq("id", id);

    if (error) {
        alert("حدث خطأ أثناء حذف المنتج.");
        console.error("Delete error:", error.message);
        return;
    }

    alert("تم حذف المنتج بنجاح ✅");
    loadProducts();
}

// تفريغ الفورم
function resetForm() {
    editingId = null;
    oldImageUrl = "";
    document.getElementById("productName").value = "";
    document.getElementById("productPrice").value = "";
    document.getElementById("productDescription").value = "";
    document.getElementById("productImage").value = "";
    document.getElementById("productCategory").value = "medicines";
    document.getElementById("formTitle").textContent = "إضافة منتج جديد";
}

// دالة حماية النصوص
function escapeHTML(text) {
    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* --- تشغيل الفحص فور التحميل --- */
checkInitialAuth();
