<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>HAyDenTra® | تواصل معنا</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            min-height: 100%;
            background: #061d2d;
        }

        body {
            margin: 0;
            min-height: 100dvh;

            font-family: "Cairo", sans-serif;

            color: #fff;

            background:
                radial-gradient(
                    circle at 50% 25%,
                    rgba(0,210,255,.16),
                    transparent 32%
                ),
                linear-gradient(
                    145deg,
                    #061c2b,
                    #073d59 55%,
                    #061d2d
                );

            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ================= NAVBAR ================= */

        .topbar {
            position: fixed;

            top: 0;
            right: 0;
            left: 0;

            height: 74px;

            z-index: 1000;

            background: rgba(4,24,42,.65);

            border-bottom:
                1px solid rgba(255,255,255,.12);

            backdrop-filter:
                blur(18px) saturate(150%);

            -webkit-backdrop-filter:
                blur(18px) saturate(150%);

            box-shadow:
                0 8px 30px rgba(0,0,0,.22);
        }

        .nav-inner {
            height: 100%;

            padding: 0 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            display: flex;
            align-items: center;

            gap: 10px;

            direction: ltr;
        }

        .nav-logo-circle {
            width: 52px;
            height: 52px;

            flex: 0 0 52px;

            border-radius: 50%;

            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 10px rgba(255,255,255,.8),
                0 0 22px rgba(0,225,255,.55);
        }

        .nav-logo-circle img {
            width: 72%;
            height: 72%;

            object-fit: contain;
        }

        .nav-brand-name {
            position: relative;

            font-size: 25px;

            line-height: 1;

            font-weight: 900;

            white-space: nowrap;

            text-shadow:
                0 0 10px rgba(255,255,255,.35);
        }

        .registered {
            position: absolute;

            top: -8px;
            right: -10px;

            font-size: 10px;

            line-height: 1;

            font-weight: 700;
        }

        .menu-btn {
            width: 58px;
            height: 58px;

            border:
                1px solid rgba(255,255,255,.25);

            border-radius: 18px;

            background:
                rgba(255,255,255,.08);

            color: white;

            font-size: 30px;

            cursor: pointer;

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        /* ================= SIDEBAR ================= */

        .overlay {
            position: fixed;

            inset: 0;

            z-index: 1050;

            background:
                rgba(0,0,0,.4);

            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);

            opacity: 0;
            visibility: hidden;

            transition: .3s;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;

            top: 0;
            right: 0;

            width: min(82%,340px);

            height: 100dvh;

            z-index: 1100;

            padding: 28px 20px;

            background:
                rgba(5,27,47,.72);

            border-left:
                1px solid rgba(255,255,255,.14);

            backdrop-filter:
                blur(22px) saturate(150%);

            -webkit-backdrop-filter:
                blur(22px) saturate(150%);

            box-shadow:
                -15px 0 40px rgba(0,0,0,.3);

            transform:
                translateX(100%);

            transition:
                transform .35s ease;

            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .close-menu {
            position: absolute;

            top: 18px;
            left: 18px;

            width: 42px;
            height: 42px;

            border:
                1px solid rgba(255,255,255,.15);

            border-radius: 12px;

            background:
                rgba(255,255,255,.07);

            color: white;

            cursor: pointer;
        }

        .sidebar-logo {
            display: flex;

            flex-direction: column;

            align-items: center;

            margin-bottom: 28px;
        }

        .sidebar-logo-circle {
            width: 70px;
            height: 70px;

            border-radius: 50%;

            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 12px rgba(255,255,255,.9),
                0 0 28px rgba(0,225,255,.6);
        }

        .sidebar-logo-circle img {
            width: 72%;
            height: 72%;

            object-fit: contain;
        }

        .sidebar-brand {
            position: relative;

            margin-top: 13px;

            direction: ltr;

            font-size: 25px;

            font-weight: 900;
        }

        .sidebar-links {
            display: flex;

            flex-direction: column;

            gap: 10px;
        }

        .sidebar-links a {
            padding: 15px;

            display: flex;
            align-items: center;

            gap: 12px;

            border-radius: 15px;

            border:
                1px solid rgba(255,255,255,.1);

            background:
                rgba(255,255,255,.06);

            font-weight: 700;

            transition: .25s;
        }

        .sidebar-links a:hover {
            background:
                rgba(0,210,255,.13);
        }

        /* ================= CONTACT ================= */

        main {
            width: min(92%, 760px);

            margin: auto;

            padding-top: 105px;
            padding-bottom: 30px;
        }

        .contact-header {
            text-align: center;

            margin-bottom: 25px;
        }

        .contact-header h1 {
            margin: 0 0 8px;

            font-size:
                clamp(28px, 7vw, 42px);

            font-weight: 900;
        }

        .contact-header p {
            margin: 0;

            color: #b8cede;

            font-size: 15px;
        }

        .contact-card {
            padding: 35px 22px;

            border-radius: 30px;

            background:
                rgba(239,244,249,.95);

            color: #09233a;

            border:
                4px solid #63d9f3;

            box-shadow:
                0 0 15px rgba(99,217,243,.7),
                0 0 40px rgba(0,210,255,.2);

            text-align: center;
        }

        .contact-logo-circle {
            width: 120px;
            height: 120px;

            margin: 0 auto 18px;

            border-radius: 50%;

            background: #fff;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 0 12px rgba(255,255,255,.9),
                0 0 30px rgba(0,225,255,.55);
        }

        .contact-logo-circle img {
            width: 72%;
            height: 72%;

            object-fit: contain;
        }

        .contact-name {
            position: relative;

            display: inline-block;

            direction: ltr;

            font-size: 38px;

            font-weight: 900;

            color: #09233a;

            margin-bottom: 12px;
        }

        .contact-name .registered {
            top: -7px;
            right: -10px;

            font-size: 10px;
        }

        .contact-description {
            color: #526577;

            line-height: 1.9;

            font-size: 16px;

            margin:
                0 auto 25px;

            max-width: 550px;
        }

        .contact-buttons {
            display: flex;

            flex-direction: column;

            gap: 12px;

            max-width: 420px;

            margin: auto;
        }

        .contact-btn {
            width: 100%;

            padding: 14px 18px;

            border-radius: 14px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            font-size: 16px;

            font-weight: 800;

            transition: .2s;
        }

        .whatsapp-btn {
            background:
                #168f67;

            color: white;
        }

        .phone-btn {
            background:
                #0a2944;

            color: white;
        }

        .contact-btn:active {
            transform: scale(.97);
        }

        footer {
            padding: 25px 15px;

            text-align: center;

            color: #91afc2;

            font-size: 13px;

            background:
                rgba(2,18,31,.35);

            border-top:
                1px solid rgba(255,255,255,.08);
        }

        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            .nav-brand-name {
                font-size: 24px;
            }

            .nav-logo-circle {
                width: 52px;
                height: 52px;
            }

            .contact-card {
                padding: 30px 17px;
            }

            .contact-logo-circle {
                width: 110px;
                height: 110px;
            }

            .contact-name {
                font-size: 34px;
            }
        }

        @media (max-width: 380px) {

            .nav-brand-name {
                font-size: 21px;
            }

            .nav-logo-circle {
                width: 48px;
                height: 48px;

                flex-basis: 48px;
            }

            .menu-btn {
                width: 54px;
                height: 54px;
            }

            .contact-name {
                font-size: 30px;
            }
        }

    </style>

</head>

<body>

<!-- ================= NAVBAR ================= -->

<header class="topbar">

    <div class="nav-inner">

        <a href="index.html" class="nav-brand">

            <div class="nav-logo-circle">

                <img
                    src="logo.png"
                    alt="HAyDenTra Logo"
                >

            </div>

            <div class="nav-brand-name">

                HAyDenTra

                <span class="registered">
                    ®
                </span>

            </div>

        </a>

        <button
            class="menu-btn"
            onclick="openMenu()"
        >

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

</header>


<!-- ================= OVERLAY ================= -->

<div
    class="overlay"
    id="overlay"
    onclick="closeMenu()"
></div>


<!-- ================= SIDEBAR ================= -->

<aside
    class="sidebar"
    id="sidebar"
>

    <button
        class="close-menu"
        onclick="closeMenu()"
    >

        <i class="fa-solid fa-xmark"></i>

    </button>


    <div class="sidebar-logo">

        <div class="sidebar-logo-circle">

            <img
                src="logo.png"
                alt="HAyDenTra Logo"
            >

        </div>

        <div class="sidebar-brand">

            HAyDenTra

            <span class="registered">
                ®
            </span>

        </div>

    </div>


    <nav class="sidebar-links">

        <a href="index.html">

            <i class="fa-solid fa-house"></i>

            الرئيسية

        </a>


        <a href="products.html">

            <i class="fa-solid fa-tooth"></i>

            المنتجات

        </a>


        <a href="contact.html">

            <i class="fa-solid fa-phone"></i>

            تواصل معنا

        </a>

    </nav>

</aside>


<!-- ================= MAIN ================= -->

<main>

    <section class="contact-header">

        <h1>
            تواصل معنا
        </h1>

        <p>
            نحن سعداء بتواصلك معنا
        </p>

    </section>


    <section class="contact-card">


        <div class="contact-logo-circle">

            <img
                src="logo.png"
                alt="HAyDenTra Logo"
            >

        </div>


        <div class="contact-name">

            HAyDenTra

            <span class="registered">
                ®
            </span>

        </div>


        <p class="contact-description">

            لو عندك أي استفسار عن المنتجات أو الأسعار
            أو عايز تعرف المزيد عن خدماتنا،
            تواصل معنا وسنكون سعداء بمساعدتك.

        </p>


        <div class="contact-buttons">


            <a
                class="contact-btn whatsapp-btn"
                href="https://wa.me/201223859088"
                target="_blank"
                rel="noopener"
            >

                <i class="fa-brands fa-whatsapp"></i>

                تواصل معنا عبر واتساب

            </a>


            <a
                class="contact-btn phone-btn"
                href="tel:201224828849"
            >

                <i class="fa-solid fa-phone"></i>

                اتصل بنا

            </a>


        </div>

    </section>

</main>


<footer>

    © 2026 HAyDenTra® — جميع الحقوق محفوظة

</footer>


<script>

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");


    function openMenu() {

        sidebar.classList.add("active");

        overlay.classList.add("active");

        document.body.style.overflow = "hidden";

    }


    function closeMenu() {

        sidebar.classList.remove("active");

        overlay.classList.remove("active");

        document.body.style.overflow = "";

    }


    document
        .querySelectorAll(".sidebar a")
        .forEach(link => {

            link.addEventListener(
                "click",
                closeMenu
            );

        });

</script>

</body>
</html>
