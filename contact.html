<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>تواصل معنا | HAyDenTra®</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            min-height: 100%;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    #0b4f70 0%,
                    #062f48 45%,
                    #031a2a 100%
                );
        }

        body {

            margin: 0;

            min-height: 100dvh;

            font-family:
                "Cairo",
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 30%,
                    #0b4f70 0%,
                    #062f48 45%,
                    #031a2a 100%
                );

            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        /* ================= NAVBAR ================= */

        .topbar {

            position: fixed;

            top: 0;
            left: 0;
            right: 0;

            height: 76px;

            z-index: 1000;

            background:
                rgba(3,24,40,.68);

            border-bottom:
                1px solid rgba(255,255,255,.13);

            backdrop-filter:
                blur(18px) saturate(160%);

            -webkit-backdrop-filter:
                blur(18px) saturate(160%);

            box-shadow:
                0 8px 30px rgba(0,0,0,.25);
        }

        .nav-container {

            width: min(1200px,94%);

            height: 100%;

            margin: auto;

            display: flex;

            align-items: center;

            justify-content: space-between;

            direction: ltr;
        }

        .menu-btn {

            width: 58px;
            height: 58px;

            border-radius: 18px;

            border:
                1px solid rgba(255,255,255,.25);

            background:
                rgba(255,255,255,.08);

            color: white;

            display: flex;

            align-items: center;
            justify-content: center;

            font-size: 29px;

            cursor: pointer;

            backdrop-filter:
                blur(12px);

            -webkit-backdrop-filter:
                blur(12px);
        }

        /* ================= BRAND ================= */

        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            direction: rtl;
        }

        .logo-circle {

            width: 62px;
            height: 62px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #fff 0%,
                    #fff 65%,
                    #f2fbff 82%,
                    rgba(255,255,255,.75) 100%
                );

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                1px solid rgba(255,255,255,.95);

            box-shadow:
                0 0 10px rgba(255,255,255,.95),
                0 0 25px rgba(0,229,255,.85),
                0 0 48px rgba(0,229,255,.45);

            flex-shrink: 0;
        }

        .logo-circle img {

            width: 73%;
            height: 73%;

            object-fit: contain;
        }

        .brand-name {

            position: relative;

            display: inline-block;

            font-size: 27px;

            font-weight: 900;

            line-height: 1;

            color: white;
        }

        .brand-name .registered {

            position: absolute;

            top: -0.08em;

            right: -0.38em;

            font-size: .45em;

            font-weight: 700;

            line-height: 1;
        }

        /* ================= SIDEBAR ================= */

        .overlay {

            position: fixed;

            inset: 0;

            z-index: 1050;

            background:
                rgba(0,0,0,.42);

            backdrop-filter:
                blur(2px);

            -webkit-backdrop-filter:
                blur(2px);

            opacity: 0;

            visibility: hidden;

            transition: .3s ease;
        }

        .overlay.active {

            opacity: 1;

            visibility: visible;
        }

        .sidebar {

            position: fixed;

            top: 0;
            right: 0;

            width: min(350px,82%);

            height: 100dvh;

            z-index: 1100;

            padding: 30px 20px;

            background:
                rgba(5,28,48,.72);

            border-left:
                1px solid rgba(255,255,255,.15);

            backdrop-filter:
                blur(24px) saturate(160%);

            -webkit-backdrop-filter:
                blur(24px) saturate(160%);

            box-shadow:
                -15px 0 45px rgba(0,0,0,.35);

            transform:
                translateX(110%);

            transition:
                transform .35s cubic-bezier(.4,0,.2,1);

            overflow-y: auto;
        }

        .sidebar.active {

            transform:
                translateX(0);
        }

        .sidebar-header {

            display: flex;

            justify-content: center;

            margin-bottom: 35px;
        }

        .sidebar .logo-circle {

            width: 82px;
            height: 82px;
        }

        .close-menu {

            position: absolute;

            top: 18px;
            left: 18px;

            width: 42px;
            height: 42px;

            border-radius: 50%;

            border:
                1px solid rgba(255,255,255,.18);

            background:
                rgba(255,255,255,.08);

            color: white;

            font-size: 20px;

            cursor: pointer;
        }

        .sidebar-links {

            display: flex;

            flex-direction: column;

            gap: 12px;
        }

        .sidebar-links a {

            color: white;

            text-decoration: none;

            padding: 15px 18px;

            border-radius: 16px;

            border:
                1px solid rgba(255,255,255,.10);

            background:
                rgba(255,255,255,.06);

            font-size: 16px;

            font-weight: 700;

            display: flex;

            align-items: center;

            gap: 13px;

            transition: .25s ease;
        }

        .sidebar-links a:hover {

            background:
                rgba(0,210,255,.15);

            border-color:
                rgba(0,229,255,.35);
        }

        /* ================= MAIN ================= */

        main {

            width: min(900px,94%);

            margin: auto;

            padding:
                calc(76px + env(safe-area-inset-top) + 45px)
                0
                30px;
        }

        /* ================= CONTACT ================= */

        .contact-wrapper {

            text-align: center;
        }

        .contact-logo {

            width: 180px;
            height: 180px;

            margin: 0 auto 22px;

            border-radius: 50%;

            background:
                radial-gradient(
                    circle,
                    #fff 0%,
                    #fff 65%,
                    #f5fcff 82%,
                    rgba(255,255,255,.7) 100%
                );

            display: flex;

            align-items: center;
            justify-content: center;

            border:
                2px solid rgba(255,255,255,.9);

            box-shadow:
                0 0 15px rgba(255,255,255,.95),
                0 0 35px rgba(0,229,255,.85),
                0 0 70px rgba(0,229,255,.45);
        }

        .contact-logo img {

            width: 73%;
            height: 73%;

            object-fit: contain;
        }

        .contact-brand {

            position: relative;

            display: inline-block;

            font-size: 55px;

            font-weight: 900;

            line-height: 1;

            color: white;

            text-shadow:
                0 0 10px rgba(255,255,255,.45),
                0 0 22px rgba(0,229,255,.30);
        }

        .contact-brand .registered {

            position: absolute;

            top: -0.08em;

            right: -0.38em;

            font-size: .45em;

            font-weight: 700;

            line-height: 1;
        }

        .contact-subtitle {

            margin-top: 20px;

            color: #bfd3e2;

            font-size: 19px;
        }

        .contact-card {

            margin-top: 45px;

            padding: 35px 25px;

            border-radius: 32px;

            background:
                linear-gradient(
                    145deg,
                    rgba(239,244,249,.97),
                    rgba(216,227,237,.97)
                );

            color: #071b31;

            border:
                5px solid #65dcf7;

            box-shadow:
                0 0 15px rgba(92,224,255,.9),
                0 0 45px rgba(0,210,255,.35);
        }

        .contact-card h1 {

            margin: 0 0 15px;

            font-size:
                clamp(29px,5vw,43px);

            font-weight: 900;
        }

        .contact-card p {

            margin: 0 0 28px;

            color: #506174;

            font-size: 17px;

            line-height: 1.9;
        }

        .contact-buttons {

            display: flex;

            flex-direction: column;

            gap: 14px;
        }

        .contact-btn {

            min-height: 58px;

            border-radius: 15px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;

            text-decoration: none;

            font-family: inherit;

            font-size: 17px;

            font-weight: 800;

            transition: .25s ease;
        }

        .whatsapp-btn {

            background:
                linear-gradient(
                    135deg,
                    #172c42,
                    #536273
                );

            color: white;
        }

        .phone-btn {

            background:
                linear-gradient(
                    135deg,
                    #087fae,
                    #05b7dc
                );

            color: white;
        }

        .contact-btn:hover {

            transform:
                translateY(-3px);
        }

        footer {

            text-align: center;

            margin-top: 35px;

            padding-bottom: 20px;

            color: #9fb4c5;

            font-size: 13px;
        }

        /* ================= MOBILE ================= */

        @media(max-width:600px) {

            .brand-name {
                font-size: 24px;
            }

            .logo-circle {
                width: 58px;
                height: 58px;
            }

            main {
                width: 94%;
            }

            .contact-logo {
                width: 180px;
                height: 180px;
            }

            .contact-brand {
                font-size: 48px;
            }

            .contact-card {
                margin-top: 38px;
                padding: 30px 18px;
            }

        }

        @media(max-width:380px) {

            .brand-name {
                font-size: 21px;
            }

            .logo-circle {
                width: 52px;
                height: 52px;
            }

            .contact-logo {
                width: 155px;
                height: 155px;
            }

            .contact-brand {
                font-size: 40px;
            }

        }

    </style>

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="topbar">

        <div class="nav-container">

            <button
                class="menu-btn"
                onclick="openMenu()"
                aria-label="فتح القائمة"
            >
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="brand">

                <div class="brand-name">

                    HAyDenTra

                    <span class="registered">
                        ®
                    </span>

                </div>

                <div class="logo-circle">

                    <img
                        src="logo.png"
                        alt="HAyDenTra Logo"
                    >

                </div>

            </div>

        </div>

    </header>

    <!-- ================= SIDEBAR ================= -->

    <div
        class="overlay"
        id="overlay"
        onclick="closeMenu()"
    ></div>

    <aside
        class="sidebar"
        id="sidebar"
    >

        <button
            class="close-menu"
            onclick="closeMenu()"
        >
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="sidebar-header">

            <div class="logo-circle">

                <img
                    src="logo.png"
                    alt="HAyDenTra Logo"
                >

            </div>

        </div>

        <nav class="sidebar-links">

            <a href="index.html">

                <i class="fa-solid fa-house"></i>

                الرئيسية

            </a>

            <a href="products.html">

                <i class="fa-solid fa-tooth"></i>

                المنتجات

            </a>

            <a href="contact.html">

                <i class="fa-solid fa-phone"></i>

                تواصل معنا

            </a>

        </nav>

    </aside>

    <!-- ================= MAIN ================= -->

    <main>

        <section class="contact-wrapper">

            <div class="contact-logo">

                <img
                    src="logo.png"
                    alt="HAyDenTra Logo"
                >

            </div>

            <div class="contact-brand">

                HAyDenTra

                <span class="registered">
                    ®
                </span>

            </div>

            <div class="contact-subtitle">
                نحن هنا لمساعدتك
            </div>

        </section>

        <!-- CONTACT CARD -->

        <section class="contact-card">

            <h1>
                تواصل معنا
            </h1>

            <p>
                للاستفسار عن المنتجات أو الأسعار أو لطلب أي من
                مستلزمات الأسنان، يمكنك التواصل معنا مباشرة.
            </p>

            <div class="contact-buttons">

                <a
                    class="contact-btn whatsapp-btn"
                    href="https://wa.me/201223859088"
                    target="_blank"
                    rel="noopener"
                >

                    <i class="fa-brands fa-whatsapp"></i>

                    تواصل معنا عبر واتساب

                </a>

                <a
                    class="contact-btn phone-btn"
                    href="tel:201224828849"
                >

                    <i class="fa-solid fa-phone"></i>

                    اتصل بنا

                </a>

            </div>

        </section>

        <footer>

            © 2026 HAyDenTra® — جميع الحقوق محفوظة

        </footer>

    </main>

    <script>

        const sidebar =
            document.getElementById("sidebar");

        const overlay =
            document.getElementById("overlay");

        function openMenu() {

            sidebar.classList.add("active");

            overlay.classList.add("active");

            document.body.classList.add("menu-open");

        }

        function closeMenu() {

            sidebar.classList.remove("active");

            overlay.classList.remove("active");

            document.body.classList.remove("menu-open");

        }

        document.addEventListener(
            "keydown",
            function(e) {

                if (e.key === "Escape") {
                    closeMenu();
                }

            }
        );

    </script>

</body>
</html>
