<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAyDenTra<sup>®</sup> - تواصل معنا</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark-top: #061527;
      --btn-green: #25d366;
      --glow-blue: #00d2ff;
      --text-dark: #0f172a;
      --text-gray: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f4f7f9;
      color: var(--text-dark);
      opacity: 0;
      animation: fadeInPage 0.5s ease forwards;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body.fade-out {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 1.2rem;
      background: rgba(6, 21, 39, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
    }

    .nav-logo-right {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }

    .nav-logo-right img {
      width: 35px;
      height: 35px;
      border-radius: 50%;
      background: #fff;
      padding: 2px;
      box-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
    }

    .nav-logo-right span {
      font-size: 1.1rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5);
    }
    .nav-logo-right span sup { font-size: 0.55rem; vertical-align: super; }

    .menu-btn {
      background: none;
      border: none;
      color: #fff;
      font-size: 1.4rem;
      cursor: pointer;
    }

    .sidebar {
      position: fixed; top: 0; right: -100%; width: 75%; height: 100vh;
      background: rgba(6, 21, 39, 0.95); backdrop-filter: blur(15px);
      z-index: 2000; padding: 2rem 1.5rem; transition: 0.3s ease;
    }
    .sidebar.active { right: 0; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.6rem; float: left; cursor: pointer; }
    .sidebar-links { margin-top: 3.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .sidebar-links a { color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.8rem; }

    .contact-section {
      background: linear-gradient(180deg, #061527 0%, #0a192f 100%);
      margin: 2rem 1.2rem; padding: 2.5rem 1.2rem; border-radius: 24px;
      text-align: center; color: #ffffff; box-shadow: 0 10px 30px rgba(6, 21, 39, 0.4);
      border: 1px solid rgba(0, 210, 255, 0.2);
    }
    .contact-section h3 { font-size: 1.4rem; font-weight: 800; margin-bottom: 0.5rem; }
    .contact-section p { font-size: 0.85rem; color: #a0aec0; margin-bottom: 2rem; }

    .phone-buttons { display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    
    .phone-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: rgba(37, 211, 102, 0.12); border: 1.5px solid var(--btn-green);
      padding: 0.85rem 1.8rem; border-radius: 14px; color: #ffffff; text-decoration: none;
      font-size: 0.95rem; font-weight: 800; direction: ltr; width: fit-content; min-width: 240px;
      box-shadow: 0 0 10px rgba(37, 211, 102, 0.25); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .phone-btn i { color: var(--btn-green); font-size: 1.2rem; filter: drop-shadow(0 0 4px var(--btn-green)); }
    .phone-btn:hover, .phone-btn:active {
      transform: translateY(-2px) scale(1.03); background: rgba(37, 211, 102, 0.25);
      box-shadow: 0 0 25px rgba(37, 211, 102, 0.9); border-color: #ffffff;
    }

    footer { text-align: center; padding: 1rem 1rem 2rem; font-size: 0.75rem; color: var(--text-gray); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="nav-logo-right">
      <img src="logo.png" alt="HAyDenTra Logo">
      <span>HAyDenTra<sup>®</sup></span>
    </a>
    <button class="menu-btn" id="openSidebar"><i class="fa-solid fa-bars"></i></button>
  </nav>

  <div class="sidebar" id="sidebar">
    <button class="close-btn" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
    <div class="sidebar-links">
      <a href="index.html">الرئيسية</a>
      <a href="products.html">المنتجات والمستلزمات</a>
      <a href="contact.html">تواصل معنا</a>
    </div>
  </div>

  <section class="contact-section">
    <h3>تواصل معنا مباشرة</h3>
    <p>جاهزون لتلبية طلبات العيادات والمراكز فوراً عبر الواتساب</p>
    
    <div class="phone-buttons">
      <a href="https://wa.me/201554238849?text=السلام%20عليكم،%20أريد%20طلب%20مستلزمات%20أو%20الاستفسار" target="_blank" class="phone-btn">
        <i class="fa-brands fa-whatsapp"></i> +20 155 423 8849
      </a>
    </div>
  </section>

  <footer>HAyDenTra<sup>®</sup> - Dental Supplies & Solutions ©</footer>

  <script>
    const openSidebar = document.getElementById('openSidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const sidebar = document.getElementById('sidebar');
    if (openSidebar) openSidebar.addEventListener('click', () => sidebar.classList.add('active'));
    if (closeSidebar) closeSidebar.addEventListener('click', () => sidebar.classList.remove('active'));

    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#') && href !== '') {
          e.preventDefault();
          document.body.classList.add('fade-out');
          setTimeout(() => { window.location.href = href; }, 400);
        }
      });
    });
  </script>
</body>
</html>
