<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAyDenTra® - تواصل معنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #081b33;
            --secondary-bg: #102d4f;
            --accent-glow: #00d2ff;
            --whatsapp-green: #25d366;
            --card-bg: #ffffff;
            --text-dark: #081b33;
            --text-main: #ffffff;
            --text-muted: #b0c4de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, #081b33 0%, #102d4f 50%, #061527 100%);
            opacity: 0;
            animation: fadeInPage 0.5s ease forwards;
        }

        body.sidebar-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* شريط علوي ثابت تماماً مع تأثير الزجاج المضيء والـ Blur */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.7rem 1.2rem;
            background: rgba(8, 27, 51, 0.85);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            border-bottom: 1px solid rgba(0, 210, 255, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .nav-logo-right {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .nav-logo-right img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.7);
        }

        .nav-logo-right .brand-text {
            font-size: 1.15rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            direction: ltr;
            unicode-bidi: embed;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: rgba(0, 210, 255, 0.25);
            border-color: rgba(0, 210, 255, 0.5);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 78%;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(145deg, rgba(16, 45, 79, 0.98) 0%, rgba(8, 27, 51, 0.99) 100%);
            backdrop-filter: blur(18px);
            z-index: 99999;
            padding: 1.5rem 1.2rem;
            transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.7);
            overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.25);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(2, 6, 23, 0.7);
            backdrop-filter: blur(5px);
            z-index: 99998;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .sidebar-logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .sidebar-logo-area img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .sidebar-logo-area .brand-text {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            direction: ltr;
            unicode-bidi: embed;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.4);
        }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .sidebar-links a:hover,
        .sidebar-links a:active {
            background: rgba(0, 210, 255, 0.25);
            border-color: rgba(0, 210, 255, 0.5);
            padding-right: 1.3rem;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .contact-container {
            max-width: 600px;
            margin: 7rem auto 2rem auto;
            padding: 0 1.2rem;
        }

        .contact-card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 2.5rem 1.5rem;
            border: 2px solid rgba(0, 210, 255, 0.4);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            text-align: center;
            color: var(--text-dark);
        }

        .contact-title {
            font-size: 1.6rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            color: #081b33;
        }

        .contact-desc {
            font-size: 0.95rem;
            color: #4a5568;
            font-weight: 600;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .contact-methods {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-decoration: none;
            padding: 1.1rem;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 900;
            transition: 0.25s;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .whatsapp-btn {
            background: #25d366;
            color: #fff;
            border: 2px solid #20ba5a;
        }

        .whatsapp-btn:hover {
            background: #20ba5a;
            box-shadow: 0 0 25px rgba(37, 211, 102, 0.6);
            transform: translateY(-2px);
        }

        .phone-btn {
            background: #081b33;
            color: #ffffff;
            border: 2px solid #00d2ff;
        }

        .phone-btn:hover {
            background: #102d4f;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 2.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 3rem;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo-right">
            <img src="logo.png" alt="HAyDenTra Logo">
            <span class="brand-text">HAyDenTra®</span>
        </a>
        <button class="menu-btn" id="openSidebar"><i class="fa-solid fa-bars"></i></button>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo-area">
                <img src="logo.png" alt="HAyDenTra Logo">
                <span class="brand-text">HAyDenTra®</span>
            </a>
            <button class="close-btn" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-links">
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات والمستلزمات</a>
            <a href="contact.html">تواصل معنا</a>
        </div>
    </div>

    <div class="contact-container">
        <div class="contact-card">
            <h1 class="contact-title">تواصل معنا</h1>
            <p class="contact-desc">نحن هنا دائماً للإجابة عن استفساراتكم وتلبية طلبات عياداتكم بأسرع وقت ممكن.</p>
            
            <div class="contact-methods">
                <a href="https://wa.me/201224828849" target="_blank" class="contact-btn whatsapp-btn">
                    <i class="fa-brands fa-whatsapp" style="font-size: 1.4rem;"></i> مراسلة عبر الواتساب (01224828849)
                </a>
                <a href="tel:01224828849" class="contact-btn phone-btn">
                    <i class="fa-solid fa-phone" style="font-size: 1.2rem; color: #00d2ff;"></i> اتصال هاتفي مباشر (01224828849)
                </a>
            </div>
        </div>
    </div>

    <footer>HAyDenTra® - Dental Supplies & Solutions © 2026</footer>

    <script>
        const openSidebar = document.getElementById('openSidebar');
        const closeSidebar = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar(open) {
            if (open) {
                sidebar.classList.add('active');
                sidebarOverlay.classList.add('active');
                document.body.classList.add('sidebar-open');
            } else {
                sidebar.classList.remove('active');
                sidebarOverlay.classList.remove('active');
                document.body.classList.remove('sidebar-open');
            }
        }

        if (openSidebar) openSidebar.addEventListener('click', () => toggleSidebar(true));
        if (closeSidebar) closeSidebar.addEventListener('click', () => toggleSidebar(false));
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('http') && !href.startsWith('tel:') && !href.startsWith('#')) {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = href; }, 400);
                }
            });
        });
    </script>
</body>

</html>
