<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAyDenTra® - Your Trusted Partner in Dental Solutions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #07101f 0%, #0a192f 50%, #030712 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الشريط العلوي: القائمة على اليسار، الشعار والاسم على اليمين */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(7, 16, 31, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .brand-container {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #fff;
        }

        .brand-container img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: contain;
            background: #fff;
        }

        /* المحتوى الرئيسي */
        .main-wrapper {
            margin-top: 90px;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* اللوجو الدائري المضيء (Glowing) */
        .glowing-logo-wrapper {
            margin-bottom: 15px;
        }

        .glowing-logo {
            width: 100px;
            height: 100px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.7), 0 0 15px rgba(255, 255, 255, 0.9);
            overflow: hidden;
            margin: 0 auto;
        }

        .glowing-logo img {
            width: 80%;
            height: 80%;
            object-fit: contain;
        }

        h1.site-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: 0.5px;
        }

        p.site-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 25px;
        }

        /* زر عرض المستلزمات والتواصل */
        .primary-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.5);
            padding: 14px;
            border-radius: 35px;
            font-size: 1.05rem;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
            margin-bottom: 12px;
        }

        .primary-btn.secondary {
            background: rgba(14, 30, 54, 0.8);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: none;
        }

        /* بطاقة المميزات البيضاء */
        .features-card {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            border-radius: 20px;
            padding: 18px 10px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-top: 25px;
            margin-bottom: 30px;
        }

        .feature-item {
            flex: 1;
            padding: 0 4px;
        }

        .feature-item .icon {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .feature-item h4 {
            font-size: 0.85rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .feature-item p {
            font-size: 0.7rem;
            color: #64748b;
        }

        /* عنوان القسم السفلي */
        .section-header {
            text-align: center;
            margin-top: 10px;
        }

        .section-header h2 {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .section-header p {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي (القائمة يسار، اللوجو والاسم يمين) -->
    <header class="navbar">
        <div class="brand-container">
            <img src="logo.png" alt="Logo">
            <span>®HAyDenTra</span>
        </div>
        <button class="menu-btn">☰</button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-wrapper">
        <!-- اللوجو الدائري المضيء -->
        <div class="glowing-logo-wrapper">
            <div class="glowing-logo">
                <img src="logo.png" alt="HAyDenTra Logo">
            </div>
        </div>

        <h1 class="site-title">HAyDenTra</h1>
        <p class="site-subtitle">Your Trusted Partner in Dental Solutions</p>

        <!-- أزرار الانتقال -->
        <a href="products.html" class="primary-btn">
            <span>←</span> عرض مستلزمات العيادة
        </a>
        <a href="contact.html" class="primary-btn secondary">
            <span>📞</span> تواصل معنا مباشرة
        </a>

        <!-- كارت المميزات الأبيض -->
        <div class="features-card">
            <div class="feature-item">
                <div class="icon">🎧</div>
                <h4>خدمة العملاء</h4>
                <p>دعم واستجابة</p>
            </div>
            <div class="feature-item">
                <div class="icon">🚚</div>
                <h4>توصيل سريع</h4>
                <p>لكافة العيادات</p>
            </div>
            <div class="feature-item">
                <div class="icon">🛡️</div>
                <h4>جودة عالية</h4>
                <p>خامات معتمدة</p>
            </div>
        </div>

        <div class="section-header">
            <h2>مستلزمات وتجهيز العيادات</h2>
            <p>اختر ما تحتاجه لعيادتك واطلبه فوراً عبر الواتساب</p>
        </div>
    </main>

</body>
</html>
