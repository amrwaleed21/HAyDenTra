<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HAyDenTra® - الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-dark-top: #061527;
      --glow-blue: #00d2ff;
      --text-dark: #0f172a;
      --text-gray: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #f4f7f9;
      color: var(--text-dark);
      overflow-x: hidden;
      opacity: 0;
      animation: fadeInPage 0.5s ease forwards;
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    body.fade-out {
      opacity: 0;
      transition: opacity 0.4s ease;
    }

    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0.8rem 1.2rem; background: rgba(6, 21, 39, 0.75);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 1000; border-bottom: 1px solid rgba(0, 210, 255, 0.2);
    }
    
    .logo-brand { 
      text-decoration: none; font-size: 1.2rem; font-weight: 900; color: #fff; 
      text-shadow: 0 0 8px rgba(0, 210, 255, 0.5); direction: ltr; display: inline-flex; align-items: baseline;
    }
    .logo-brand span.trademark { font-size: 0.52rem; margin-left: 1px; position: relative; top: -4px; font-weight: 700; }
    
    .menu-btn { background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    .sidebar {
      position: fixed; top: 0; right: -100%; width: 75%; height: 100vh;
      background: rgba(6, 21, 39, 0.95); backdrop-filter: blur(15px);
      z-index: 2000; padding: 2rem 1.5rem; transition: 0.3s ease; box-shadow: -5px 0 25px rgba(0,0,0,0.8);
    }
    .sidebar.active { right: 0; }
    .close-btn { background: none; border: none; color: #fff; font-size: 1.6rem; float: left; cursor: pointer; }
    .sidebar-links { margin-top: 3.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .sidebar-links a { color: #fff; text-decoration: none; font-size: 1.1rem; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 0.8rem; }

    .hero {
      background: radial-gradient(circle at top, #0f3866 0%, var(--bg-dark-top) 80%);
      padding: 3rem 1rem 4rem; text-align: center; color: #ffffff;
    }
    .logo-glow-container { position: relative; display: inline-block; margin-bottom: 1rem; }
    .logo-glow-container::before {
      content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 95px; height: 95px; background: var(--glow-blue); opacity: 0.6; filter: blur(22px); border-radius: 50%;
    }
    .logo-glow-container img { position: relative; width: 80px; height: 80px; background: #fff; border-radius: 50%; padding: 6px; box-shadow: 0 0 15px rgba(0, 210, 255, 0.4); }
    
    .hero h1 { 
      font-size: 2rem; font-weight: 900; margin-bottom: 0.2rem; 
      text-shadow: 0 0 12px rgba(0, 210, 255, 0.5); direction: ltr; 
      display: inline-flex; align-items: baseline; justify-content: center; 
    }
    .hero h1 span.trademark { font-size: 0.7rem; margin-left: 2px; position: relative; top: -8px; font-weight: 700; }
    .hero p { font-size: 0.88rem; color: #a0aec0; margin-bottom: 2rem; }

    .btn-main-glow {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      background: linear-gradient(135deg, #00a8cc 0%, #007791 100%); color: #fff;
      padding: 0.75rem 1.8rem; border-radius: 30px; text-decoration: none; font-weight: 800;
      font-size: 0.9rem; width: fit-content; margin: 0.4rem auto; box-shadow: 0 0 12px rgba(0, 210, 255, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.3); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .btn-main-glow:hover, .btn-main-glow:active { transform: translateY(-2px) scale(1.03); box-shadow: 0 0 28px rgba(0, 210, 255, 1); border-color: #fff; }

    .features-card {
      margin: -2rem 1.2rem 2rem; background: #ffffff; border-radius: 18px;
      padding: 1.2rem 0.5rem; box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; text-align: center; position: relative; z-index: 10;
    }
    .feature-item i { font-size: 1.3rem; color: #00a8cc; margin-bottom: 0.4rem; filter: drop-shadow(0 0 6px rgba(0, 168, 204, 0.4)); }
    .feature-item h4 { font-size: 0.78rem; font-weight: 800; }
    .feature-item p { font-size: 0.65rem; color: var(--text-gray); margin-top: 0.2rem; }

    footer { text-align: center; padding: 2rem 1rem; font-size: 0.75rem; color: var(--text-gray); }
  </style>
</head>
<body>

  <nav class="navbar">
    <a href="index.html" class="logo-brand">HAyDenTra<span class="trademark">®</span></a>
    <button class="menu-btn" id="openSidebar"><i class="fa-solid fa-bars"></i></button>
  </nav>

  <div class="sidebar" id="sidebar">
    <button class="close-btn" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
    <div class="sidebar-links">
      <a href="index.html">الرئيسية</a>
      <a href="products.html">المنتجات والمستلزمات</a>
      <a href="contact.html">تواصل معنا</a>
    </div>
  </div>

  <section class="hero">
    <div class="logo-glow-container">
      <img src="logo.png" alt="HAyDenTra Logo">
    </div>
    <h1>HAyDenTra<span class="trademark">®</span></h1>
    <p>Your Trusted Partner in Dental Solutions</p>
    
    <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
      <a href="products.html" class="btn-main-glow">
        <i class="fa-solid fa-boxes-packing"></i>
        <span>عرض المنتجات والمستلزمات</span>
      </a>
      <a href="contact.html" class="btn-main-glow" style="background: rgba(255,255,255,0.1);">
        <i class="fa-solid fa-phone"></i>
        <span>تواصل معنا مباشرة</span>
      </a>
    </div>
  </section>

  <div class="features-card">
    <div class="feature-item">
      <i class="fa-solid fa-shield-halved"></i>
      <h4>جودة عالية</h4>
      <p>خامات معتمدة</p>
    </div>
    <div class="feature-item">
      <i class="fa-solid fa-truck-fast"></i>
      <h4>توصيل سريع</h4>
      <p>شحن مباشر</p>
    </div>
    <div class="feature-item">
      <i class="fa-solid fa-headset"></i>
      <h4>خدمة العملاء</h4>
      <p>تجاوب فوري</p>
    </div>
  </div>

  <footer>HAyDenTra<span style="font-size: 0.52rem; position: relative; top: -3px; font-weight: 700;">®</span> - Dental Supplies & Solutions ©</footer>

  <script>
    const openSidebar = document.getElementById('openSidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const sidebar = document.getElementById('sidebar');
    if (openSidebar) openSidebar.addEventListener('click', () => sidebar.classList.add('active'));
    if (closeSidebar) closeSidebar.addEventListener('click', () => sidebar.classList.remove('active'));

    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', function(e) {
        const href = this.getAttribute('href');
        if (href && !href.startsWith('http') && !href.startsWith('#') && href !== '') {
          e.preventDefault();
          document.body.classList.add('fade-out');
          setTimeout(() => { window.location.href = href; }, 400);
        }
      });
    });
  </script>
</body>
</html>
