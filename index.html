<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAyDenTra® - Dental Supplies & Solutions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #07101e 0%, #0a192f 50%, #030712 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* الشريط العلوي الثابت */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(7, 16, 30, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .brand-logo {
            font-size: 1.25rem;
            font-weight: bold;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-logo img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
        }

        /* المحتوى الرئيسي */
        .main-content {
            margin-top: 90px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hero-logo-container {
            margin-bottom: 15px;
        }

        .hero-logo {
            width: 90px;
            height: 90px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
            margin: 0 auto;
        }

        .hero-logo svg {
            width: 50px;
            height: 50px;
            fill: #0a192f;
        }

        h1.title {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* الأزرار الرئيسية */
        .btn-group {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 40px;
        }

        .custom-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            border-radius: 30px;
            font-size: 1.05rem;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            border: 1px solid rgba(56, 189, 248, 0.4);
            background: rgba(14, 30, 54, 0.8);
            color: #ffffff;
            box-shadow: inset 0 0 15px rgba(56, 189, 248, 0.15);
        }

        .custom-btn:hover {
            background: rgba(56, 189, 248, 0.2);
            border-color: #38bdf8;
        }

        /* بطاقات المميزات السفلى */
        .features-card {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            max-width: 500px;
            border-radius: 20px;
            padding: 20px 10px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        .feature-item {
            flex: 1;
            padding: 0 5px;
        }

        .feature-item .icon {
            font-size: 1.4rem;
            margin-bottom: 5px;
        }

        .feature-item h4 {
            font-size: 0.9rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .feature-item p {
            font-size: 0.75rem;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #64748b;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي الثابت -->
    <header class="navbar">
        <button class="menu-btn">☰</button>
        <div class="brand-logo">
            HAyDenTra®
        </div>
    </header>

    <!-- المحتوى -->
    <main class="main-content">
        <div class="hero-logo-container">
            <div class="hero-logo">
                <!-- أيقونة الأسنان -->
                <svg viewBox="0 0 24 24"><path d="M12,2C8,2 5,5 5,9C5,11.5 6.5,13.8 8.5,15C9.2,15.4 9.5,16.2 9.2,17C8.8,18 8.5,19 8.5,20C8.5,21.4 9.6,22.5 11,22.5C12,22.5 12.8,21.8 13.2,21C13.8,19.8 14.5,19.2 15.5,19.2C16.5,19.2 17.2,19.8 17.8,21C18.2,21.8 19,22.5 20,22.5C21.4,22.5 22.5,21.4 22.5,20C22.5,19 22.2,18 21.8,17C21.5,16.2 21.8,15.4 22.5,15C24.5,13.8 26,11.5 26,9C26,5 23,2 19,2C16.5,2 14.3,3.3 13,5.3C11.7,3.3 9.5,2 7,2H12Z"/></svg>
            </div>
        </div>

        <h1 class="title">HAyDenTra®</h1>
        <p class="subtitle">Your Trusted Partner in Dental Solutions</p>

        <div class="btn-group">
            <a href="products.html" class="custom-btn">
                📦 عرض المنتجات والمستلزمات
            </a>
            <a href="contact.html" class="custom-btn">
                📞 تواصل معنا مباشرة
            </a>
        </div>

        <div class="features-card">
            <div class="feature-item">
                <div class="icon">🎧</div>
                <h4>خدمة العملاء</h4>
                <p>تجاوب فوري</p>
            </div>
            <div class="feature-item">
                <div class="icon">🚚</div>
                <h4>توصيل سريع</h4>
                <p>شحن مباشر</p>
            </div>
            <div class="feature-item">
                <div class="icon">🛡️</div>
                <h4>جودة عالية</h4>
                <p>خامات معتمدة</p>
            </div>
        </div>
    </main>

    <footer>
        © HAyDenTra® - Dental Supplies & Solutions
    </footer>

</body>
</html>
