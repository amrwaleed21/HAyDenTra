<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>HAyDenTra® | مستلزمات الأسنان</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        html {
            min-height: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #e6f4f8 50%, #d8eff6 100%);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100dvh;
            font-family: "Cairo", sans-serif;
            color: #1e3a8a;
            background:
                radial-gradient(circle at 50% 28%, rgba(186, 230, 253, 0.4), transparent 45%),
                linear-gradient(180deg, #ffffff 0%, #e8f5f9 50%, #dbeffe 100%);
            overflow-x: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        body.menu-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           INITIAL BLUR OVERLAY
        ========================= */
        .blur-overlay {
            position: fixed;
            inset: 0;
            z-index: 1500;
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            pointer-events: none;
            transition: opacity 0.8s ease, backdrop-filter 0.8s ease, -webkit-backdrop-filter 0.8s ease;
        }

        .blur-overlay.fade-out {
            opacity: 0;
            backdrop-filter: blur(0px);
            -webkit-backdrop-filter: blur(0px);
        }

        /* =========================
           NAVBAR
        ========================= */

        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 74px;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(186, 230, 253, 0.6);

            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);

            box-shadow: 0 4px 20px rgba(186, 230, 253, 0.3);
        }

        .nav-inner {
            height: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
        }

        .nav-logo-circle {
            width: 50px;
            height: 50px;
            flex-shrink: 0;

            border-radius: 50%;
            background: #fff;

            display: grid;
            place-items: center;

            border: 1px solid rgba(14, 165, 233, 0.3);

            box-shadow:
                0 0 8px rgba(186, 230, 253, 0.8),
                0 0 15px rgba(56, 189, 248, 0.2);
        }

        .nav-logo-circle img {
            width: 72%;
            height: 72%;
            object-fit: contain;
        }

        .brand-name {
            position: relative;
            display: inline-block;

            font-family: Arial, sans-serif;
            font-weight: 900;
            font-size: 27px;
            line-height: 1;
            color: #0284c7;
            white-space: nowrap;
        }

        .brand-name .registered {
            position: absolute;
            top: -7px;
            right: -9px;

            font-family: Arial, sans-serif;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
        }

        .menu-btn {
            width: 58px;
            height: 58px;

            border-radius: 18px;
            border: 1px solid rgba(14, 165, 233, 0.2);

            background: rgba(240, 249, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: #0284c7;
            font-size: 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(186, 230, 253, 0.3),
                inset 0 1px rgba(255, 255, 255, 0.8);

            transition: background 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
        }

        .menu-btn:hover {
            background: rgba(224, 242, 254, 0.9);
            transform: translateY(-1px);
        }

        /* =========================
           SIDEBAR
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1050;

            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);

            opacity: 0;
            visibility: hidden;

            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;

            width: min(80%, 350px);
            height: 100dvh;

            z-index: 1100;

            padding: 28px 20px;

            background: rgba(255, 255, 255, 0.92);
            border-left: 1px solid rgba(186, 230, 253, 0.5);

            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);

            box-shadow: -10px 0 35px rgba(186, 230, 253, 0.4);

            transform: translateX(110%);
            transition: transform 0.35s ease;

            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding-bottom: 25px;
            margin-bottom: 20px;

            border-bottom: 1px solid rgba(186, 230, 253, 0.5);
        }

        .sidebar-logo {
            width: 72px;
            height: 72px;

            border-radius: 50%;
            background: #fff;

            display: grid;
            place-items: center;

            box-shadow:
                0 0 10px rgba(186, 230, 253, 0.8),
                0 0 20px rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(14, 165, 233, 0.2);
