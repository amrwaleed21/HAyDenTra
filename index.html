<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAyDenTra® - Your Trusted Partner in Dental Solutions</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --btn-green: #25d366;
            --glow-blue: #00d2ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            background-color: #081b33;
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, #081b33 0%, #102d4f 50%, #061527 100%);
            opacity: 0;
            animation: fadeInPage 0.5s ease forwards;
        }

        body.sidebar-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        @keyframes fadeInPage {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        body.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.2rem;
            background: rgba(8, 27, 51, 0.9);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .nav-logo-right {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-logo-right img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .nav-logo-right .brand-text {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            direction: ltr;
            unicode-bidi: embed;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: rgba(0, 210, 255, 0.4);
        }

        /* القائمة الجانبية بمكس واضح بين الكحلي والأبيض الشفاف الـ Glassy */
        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 78%;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(145deg, rgba(16, 45, 79, 0.85) 0%, rgba(255, 255, 255, 0.12) 50%, rgba(8, 27, 51, 0.9) 100%);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            z-index: 99999;
            padding: 1.5rem 1.2rem;
            transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.7);
            overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.25);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 99998;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .sidebar-logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .sidebar-logo-area img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .sidebar-logo-area .brand-text {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            direction: ltr;
            unicode-bidi: embed;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.4);
        }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .sidebar-links a:hover,
        .sidebar-links a:active {
            background: rgba(0, 210, 255, 0.25);
            border-color: rgba(0, 210, 255, 0.5);
            padding-right: 1.3rem;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        .hero-section {
            text-align: center;
            padding: 2.5rem 1.2rem 1.5rem;
        }

        .hero-logo-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .hero-logo {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ffffff;
            padding: 4px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
            object-fit: contain;
        }

        .hero-brand {
            font-size: 1.8rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.6);
            direction: ltr;
            unicode-bidi: embed;
        }

        .hero-subtitle {
            font-size: 0.85rem;
            color: #b0c4de;
            margin-bottom: 2rem;
            font-weight: 600;
        }

        .cta-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 400px;
            margin: 0 auto 2.5rem;
            padding: 0 1.2rem;
        }

        .cta-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.9rem 1.5rem;
            border-radius: 14px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            transition: 0.25s ease;
        }

        .cta-btn.primary {
            background: linear-gradient(135deg, #00a8cc 0%, #00d2ff 100%);
            color: #061527;
            box-shadow: 0 4px 20px rgba(0, 210, 255, 0.4);
        }

        .cta-btn.primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 210, 255, 0.6);
        }

        .cta-btn.secondary {
            background: rgba(16, 45, 79, 0.8);
            color: #ffffff;
            border: 1px solid rgba(0, 210, 255, 0.3);
        }

        .cta-btn.secondary:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        .features-card {
            background: rgba(13, 38, 68, 0.7);
            border: 1px solid rgba(0, 210, 255, 0.25);
            border-radius: 20px;
            margin: 0 1.2rem 2rem;
            padding: 1.2rem;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.5rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .feature-item {
            text-align: center;
            padding: 0.5rem;
        }

        .feature-item i {
            font-size: 1.3rem;
            color: var(--glow-blue);
            margin-bottom: 0.4rem;
        }

        .feature-item h4 {
            font-size: 0.78rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.2rem;
        }

        .feature-item p {
            font-size: 0.65rem;
            color: #b0c4de;
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem 2rem;
            font-size: 0.75rem;
            color: #b0c4de;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo-right">
            <img src="logo.png" alt="HAyDenTra Logo">
            <span class="brand-text">HAyDenTra®</span>
        </a>
        <button class="menu-btn" id="openSidebar"><i class="fa-solid fa-bars"></i></button>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo-area">
                <img src="logo.png" alt="HAyDenTra Logo">
                <span class="brand-text">HAyDenTra®</span>
            </a>
            <button class="close-btn" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-links">
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات والمستلزمات</a>
            <a href="contact.html">تواصل معنا</a>
        </div>
    </div>

    <div class="hero-section">
        <div class="hero-logo-container">
            <img src="logo.png" alt="HAyDenTra Logo" class="hero-logo">
            <h1 class="hero-brand">HAyDenTra®</h1>
        </div>
        <p class="hero-subtitle">Your Trusted Partner in Dental Solutions</p>

        <div class="cta-container">
            <a href="products.html" class="cta-btn primary">
                <i class="fa-solid fa-box-open"></i> عرض المنتجات والمستلزمات
            </a>
            <a href="contact.html" class="cta-btn secondary">
                <i class="fa-solid fa-phone"></i> تواصل معنا مباشرة
            </a>
        </div>

        <div class="features-card">
            <div class="feature-item">
                <i class="fa-solid fa-shield-halved"></i>
                <h4>جودة عالية</h4>
                <p>خامات معتمدة</p>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-truck-fast"></i>
                <h4>توصيل سريع</h4>
                <p>شحن مباشر</p>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-headset"></i>
                <h4>خدمة العملاء</h4>
                <p>تجاوب فوري</p>
            </div>
        </div>
    </div>

    <footer>© HAyDenTra® - Dental Supplies & Solutions</footer>

    <script>
        const openSidebar = document.getElementById('openSidebar');
        const closeSidebar = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar(open) {
            if (open) {
                sidebar.classList.add('active');
                sidebarOverlay.classList.add('active');
                document.body.classList.add('sidebar-open');
            } else {
                sidebar.classList.remove('active');
                sidebarOverlay.classList.remove('active');
                document.body.classList.remove('sidebar-open');
            }
        }

        if (openSidebar) openSidebar.addEventListener('click', () => toggleSidebar(true));
        if (closeSidebar) closeSidebar.addEventListener('click', () => toggleSidebar(false));
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href && !href.startsWith('http') && !href.startsWith('#') && href !== '') {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = href; }, 400);
                }
            });
        });
    </script>
</body>

</html>
