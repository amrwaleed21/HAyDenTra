<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>HAyDenTra® | المنتجات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }

        html {
            min-height: 100%;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100dvh;
            font-family: "Cairo", sans-serif;
            color: #1e3a8a;
            background: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        body.menu-open,
        body.modal-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           POP-UP ANIMATIONS
        ========================= */

        @keyframes appleGlassAppear {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .pop-element {
            animation: appleGlassAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: transform, opacity;
        }

        /* =========================
           HERO BG (PARALLAX ENHANCED)
        ========================= */

        .hero-bg-section {
            position: fixed;
            top: 74px;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url("searchbarbg.jpg") center top / cover no-repeat;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        /* =========================
           NAVBAR (iOS GLASS)
        ========================= */

        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 74px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.35);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 8px 32px rgba(2, 132, 199, 0.08);
        }

        .nav-inner {
            height: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
        }

        .nav-logo-circle {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            display: grid;
            place-items: center;
            border: 1px solid rgba(14, 165, 233, 0.3);
            box-shadow: 0 0 8px rgba(186, 230, 253, 0.8), 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .nav-logo-circle img {
            width: 72%;
            height: 72%;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand-name {
            position: relative;
            display: inline-block;
            font-family: Arial, sans-serif;
            font-size: 27px;
            line-height: 1;
            font-weight: 900;
            color: #0284c7;
            white-space: nowrap;
            direction: ltr;
        }

        .brand-name .registered {
            position: absolute;
            top: -7px;
            right: -9px;
            font-size: 10px;
            line-height: 1;
        }

        .menu-btn {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #0284c7;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(186, 230, 253, 0.2);
            transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.04);
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1050;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: .35s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: min(80%, 350px);
            height: 100dvh;
            z-index: 1100;
            padding: 28px 20px;
            background: rgba(255, 255, 255, 0.55);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            box-shadow: -10px 0 35px rgba(2, 132, 199, 0.15);
            transform: translateX(110%);
            transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 25px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(186, 230, 253, 0.5);
        }

        .sidebar-logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 0 10px rgba(186, 230, 253, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .sidebar-logo img {
            width: 72%;
            height: 72%;
            object-fit: contain;
            border-radius: 50%;
        }

        .sidebar-brand {
            position: relative;
            margin-top: 13px;
            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: 900;
            direction: ltr;
            color: #0284c7;
        }

        .sidebar-brand .registered {
            position: absolute;
            top: -5px;
            right: -8px;
            font-size: 9px;
        }

        .close-btn {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.6);
            color: #0284c7;
            font-size: 20px;
            cursor: pointer;
            transition: .25s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }

        .side-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 16px;
            margin-bottom: 10px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 700;
            color: #0369a1;
            transition: .25s;
        }

        .side-link i {
            width: 25px;
            text-align: center;
            color: #0284c7;
        }

        .side-link:hover,
        .side-link.active {
            background: rgba(224, 242, 254, 0.6);
            border-color: #38bdf8;
            color: #0284c7;
        }

        /* =========================
           MAIN & PAGE HEADER
        ========================= */

        main {
            position: relative;
            z-index: 1;
            padding-top: 74px;
        }

        .page-header {
            text-align: center;
            padding: 40px 18px 25px;
        }

        .main-logo-circle {
            width: 95px;
            height: 95px;
            margin: 0 auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            display: grid;
            place-items: center;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25), 0 0 35px rgba(56, 189, 248, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.9);
            outline: 1px solid rgba(14, 165, 233, 0.3);
        }

        .main-logo-circle img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 50%;
        }

        .main-brand {
            position: relative;
            display: inline-block;
            margin-top: 18px;
            font-family: Arial, sans-serif;
            font-size: 40px;
            line-height: 1;
            font-weight: 900;
            direction: ltr;
            color: #0284c7;
            letter-spacing: .5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        .main-brand .registered {
            position: absolute;
            top: -6px;
            right: -10px;
            font-size: 13px;
        }

        .page-header h1 {
            margin-top: 18px;
            font-size: clamp(26px, 6vw, 38px);
            font-weight: 900;
            color: #0f172a;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
        }

        .page-header p {
            margin-top: 8px;
            color: #0369a1;
            font-size: 16px;
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        /* =========================
           CONTENT BODY WRAPPER (WHITE GRADIENT BLEND)
        ========================= */

        .content-body-wrapper {
            position: relative;
            z-index: 2;
            margin-top: 10px;
            padding-top: 30px;
            padding-bottom: 20px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.55) 70px,
                rgba(255, 255, 255, 0.88) 140px,
                #ffffff 220px,
                #ffffff 100%
            );
        }

        /* =========================
           iOS GLASS FILTERS
        ========================= */

        .filters {
            width: min(100% - 24px, 1100px);
            margin: 0 auto 35px;
            padding: 22px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 12px 35px rgba(2, 132, 199, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 12px;
        }

        .search-box,
        .sort-select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #0f172a;
            font-family: "Cairo", sans-serif;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.04);
            transition: .25s ease;
        }

        .search-box:focus,
        .sort-select:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.18);
        }

        .search-box::placeholder {
            color: #64748b;
            font-weight: 700;
        }

        .chips {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .chip {
            flex-shrink: 0;
            padding: 9px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #0369a1;
            font-family: "Cairo", sans-serif;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chip:hover {
            background: rgba(224, 242, 254, 0.8);
            transform: translateY(-1px);
        }

        .chip.active {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
        }

        /* =========================
           NEW iOS GLASS PRODUCT CARDS
        ========================= */

        .products-grid {
            width: min(100% - 24px, 1100px);
            margin: 20px auto 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .product-card {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            
            /* iOS Liquid Glass Effect */
            background: rgba(255, 255, 255, 0.42);
            border: 1px solid rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(20px) saturate(190%);
            -webkit-backdrop-filter: blur(20px) saturate(190%);
            
            box-shadow: 0 15px 35px -5px rgba(2, 132, 199, 0.08), 
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.9),
                        inset 0 -1px 1px 0 rgba(2, 132, 199, 0.05);
                        
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s ease, 
                        border-color 0.3s ease, 
                        background 0.3s ease;
                        
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            cursor: pointer;
        }

        /* Glass light reflection highlight */
        .product-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            border-radius: 28px 28px 0 0;
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.65);
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 22px 45px -8px rgba(2, 132, 199, 0.18), 
                        inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        .product-image {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.35);
            margin: 12px 12px 0 12px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.8);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 14px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-card:hover .product-image img {
            transform: scale(1.06);
        }

        .product-image i {
            font-size: 65px;
            color: #0284c7;
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        .product-category {
            color: #0284c7;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .3px;
        }

        .product-name {
            margin-top: 6px;
            font-size: 17px;
            line-height: 1.45;
            font-weight: 900;
            color: #0f172a;
        }

        .product-description {
            margin-top: 8px;
            color: #475569;
            font-size: 12px;
            line-height: 1.6;
            font-weight: 600;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        .price {
            font-size: 17px;
            font-weight: 900;
            color: #0284c7;
        }

        .order-btn {
            border: 0;
            padding: 10px 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            font-family: "Cairo", sans-serif;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
            transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .order-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.42);
        }

        /* =========================
           NEW iOS GLASS PRODUCT MODAL
        ========================= */

        .product-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
        }

        .product-modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .product-modal-card {
            position: relative;
            width: min(100%, 720px);
            max-height: 90dvh;
            
            /* Ultra Glass Effect */
            background: rgba(255, 255, 255, 0.65);
            border-radius: 32px;
            border: 1px solid rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            
            box-shadow: 0 30px 60px -12px rgba(2, 132, 199, 0.22), 
                        inset 0 1.5px 2px rgba(255, 255, 255, 1);
                        
            overflow-y: auto;
            transform: scale(0.88) translateY(20px);
            opacity: 0;
            transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .product-modal-backdrop.active .product-modal-card {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .modal-close-btn {
            position: absolute;
            top: 16px;
            left: 16px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.6);
            color: #0284c7;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.1);
            transition: 0.3s ease;
        }

        .modal-close-btn:hover {
            background: #0284c7;
            color: #ffffff;
            transform: rotate(90deg) scale(1.05);
        }

        .modal-image-wrap {
            background: rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            margin: 16px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            position: relative;
            min-height: 280px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.9);
        }

        .modal-image-wrap img {
            max-width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 16px;
        }

        .modal-image-wrap i {
            font-size: 90px;
            color: #0284c7;
        }

        .modal-details {
            padding: 28px 24px 28px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .modal-category {
            color: #0284c7;
            font-size: 13px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .modal-title {
            font-size: 23px;
            font-weight: 900;
            color: #0f172a;
            margin-top: 6px;
            line-height: 1.3;
        }

        .modal-description {
            margin-top: 14px;
            color: #334155;
            font-size: 14px;
            line-height: 1.8;
            font-weight: 700;
            white-space: pre-line;
            max-height: 180px;
            overflow-y: auto;
            padding-left: 5px;
        }

        .modal-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-price-tag {
            font-size: 22px;
            font-weight: 900;
            color: #0284c7;
        }

        .modal-order-btn {
            width: 100%;
            padding: 14px;
            border-radius: 16px;
            border: 0;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            font-family: "Cairo", sans-serif;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal-order-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 12px 25px rgba(2, 132, 199, 0.45);
        }

        .loading {
            grid-column: 1 / -1;
            width: 100%;
            margin: 40px auto;
            text-align: center;
            color: #0369a1;
            font-weight: 800;
            font-size: 16px;
        }

        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: #0369a1;
            font-weight: 800;
            padding: 40px 20px;
            display: none;
        }

        footer {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px 15px 25px;
            text-align: center;
            color: #0369a1;
            font-size: 13px;
            font-weight: 700;
            background: #ffffff;
            border-top: 1px solid rgba(224, 242, 254, 0.8);
        }

        /* =========================
           RESPONSIVE DESIGN
        ========================= */

        @media(max-width: 900px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media(max-width: 768px) {
            .product-modal-card {
                grid-template-columns: 1fr;
            }

            .modal-image-wrap {
                min-height: 220px;
                padding: 16px;
                margin: 12px;
            }

            .modal-image-wrap img {
                max-height: 200px;
            }

            .modal-details {
                padding: 16px 20px 24px;
            }

            .modal-title {
                font-size: 20px;
            }
        }

        @media(max-width: 600px) {

            .nav-inner {
                padding: 0 18px;
            }

            .nav-logo-circle {
                width: 48px;
                height: 48px;
            }

            .brand-name {
                font-size: 24px;
            }

            .menu-btn {
                width: 54px;
                height: 54px;
            }

            .page-header {
                padding-top: 25px;
            }

            .main-logo-circle {
                width: 85px;
                height: 85px;
            }

            .main-brand {
                font-size: 35px;
            }

            .filters {
                padding: 16px;
            }

            .filter-row {
                grid-template-columns: 1fr;
            }

            .products-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
                width: min(100% - 16px, 1100px);
            }

            .product-image {
                height: 140px;
                margin: 8px 8px 0 8px;
            }

            .product-info {
                padding: 12px;
            }

            .product-name {
                font-size: 14px;
            }

            .price {
                font-size: 14px;
            }

            .order-btn {
                padding: 8px 10px;
                font-size: 11px;
            }
        }

        @media(max-width: 420px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .brand-name {
                font-size: 21px;
            }

            .main-brand {
                font-size: 30px;
            }
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .35;
            background-image: radial-gradient(rgba(14, 165, 233, 0.15) .7px, transparent .7px);
            background-size: 18px 18px;
            mask-image: linear-gradient(to bottom, #000, transparent 80%);
            z-index: 0;
        }
    </style>
</head>

<body>

    <div class="hero-bg-section" id="heroBg"></div>

    <header class="topbar">

        <div class="nav-inner">

            <div class="nav-brand">

                <div class="nav-logo-circle">
                    <img src="logo.png" alt="HAyDenTra Logo">
                </div>

                <div class="brand-name">
                    HAyDenTra
                    <span class="registered">®</span>
                </div>

            </div>

            <button class="menu-btn" onclick="openMenu()">
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>

    </header>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">

        <button class="close-btn" onclick="closeMenu()">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="sidebar-header">

            <div class="sidebar-logo">
                <img src="logo.png" alt="HAyDenTra Logo">
            </div>

            <div class="sidebar-brand">
                HAyDenTra
                <span class="registered">®</span>
            </div>

        </div>

        <a href="index.html" class="side-link">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>

        <a href="products.html" class="side-link active">
            <i class="fa-solid fa-tooth"></i>
            <span>المنتجات</span>
        </a>

        <a href="contact.html" class="side-link">
            <i class="fa-solid fa-phone"></i>
            <span>تواصل معنا</span>
        </a>

    </aside>

    <main>

        <section class="page-header pop-element" style="animation-delay: 0.05s;">

            <div class="main-logo-circle">
                <img src="logo.png" alt="HAyDenTra Logo">
            </div>

            <div class="main-brand">
                HAyDenTra
                <span class="registered">®</span>
            </div>

            <h1>منتجات ومستلزمات الأسنان</h1>

            <p>
                مجموعة مختارة من المواد والأدوية والأجهزة والأدوات الطبية
            </p>

        </section>

        <!-- بداية الحاوية ذات الخلفية البيضاء المتدرجة الممزوجة مع خلفية searchbarbg -->
        <div class="content-body-wrapper">

            <section class="filters pop-element" style="animation-delay: 0.15s;">

                <div class="filter-row">

                    <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن أداة، دواء، جهاز، أو مادة طبية...">

                    <select id="sortSelect" class="sort-select">

                        <option value="default">
                            ترتيب التلقائي
                        </option>

                        <option value="high">
                            السعر: من الأعلى للأقل
                        </option>

                        <option value="low">
                            السعر: من الأقل للأعلى
                        </option>

                    </select>

                </div>

                <div class="chips">

                    <button class="chip active" data-category="all">
                        الكل
                    </button>

                    <button class="chip" data-category="medicines">
                        الأدوية
                    </button>

                    <button class="chip" data-category="materials">
                        المواد
                    </button>

                    <button class="chip" data-category="devices">
                        الأجهزة
                    </button>

                    <button class="chip" data-category="tools">
                        الأدوات
                    </button>

                </div>

            </section>

            <section class="products-grid" id="productsGrid">

                <div class="loading" id="loading">
                    <i class="fa-solid fa-spinner fa-spin"></i> جاري تحميل المنتجات من قاعدة البيانات...
                </div>

            </section>

            <div class="no-results" id="noResults">
                لا توجد منتجات مطابقة للبحث.
            </div>

        </div>

    </main>

    <!-- iOS GLASS PRODUCT DETAIL MODAL -->
    <div class="product-modal-backdrop" id="productModal" onclick="closeProductModal(event)">
        <div class="product-modal-card" onclick="event.stopPropagation()">
            <button class="modal-close-btn" onclick="closeProductModal()">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="modal-image-wrap" id="modalImageWrap"></div>

            <div class="modal-details">
                <div>
                    <div class="modal-category" id="modalCategory"></div>
                    <h2 class="modal-title" id="modalTitle"></h2>
                    <div class="modal-description" id="modalDescription"></div>
                </div>

                <div class="modal-footer">
                    <div class="modal-price-tag" id="modalPrice"></div>
                    <button type="button" class="modal-order-btn" id="modalOrderBtn">
                        <i class="fa-brands fa-whatsapp"></i>
                        اطلب هذا المنتج الآن
                    </button>
                </div>
            </div>
        </div>
    </div>

    <footer>
        © 2026 HAyDenTra® - جميع الحقوق محفوظة
    </footer>

    <script>

        const SUPABASE_URL = "https://hcvajgyjiflkcsdjvzib.supabase.co";
        const SUPABASE_KEY = "sb_publishable_NhB5QvshhLY4rPpOTLjGXw_dBjCbSOW";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        /* PARALLAX EFFECT ON SCROLL */

        const heroBg = document.getElementById("heroBg");
        window.addEventListener("scroll", () => {
            const scrolled = window.scrollY;
            if (heroBg) {
                heroBg.style.transform = `translateY(-${scrolled * 0.35}px)`;
            }
        });

        /* MENU CONTROLS */

        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        function openMenu() {
            sidebar.classList.add("active");
            overlay.classList.add("active");
            document.body.classList.add("menu-open");
        }

        function closeMenu() {
            sidebar.classList.remove("active");
            overlay.classList.remove("active");
            document.body.classList.remove("menu-open");
        }

        /* SUPABASE DATABASE INTEGRATION */

        const productsGrid = document.getElementById("productsGrid");
        const loading = document.getElementById("loading");
        const noResults = document.getElementById("noResults");
        const searchInput = document.getElementById("searchInput");
        const sortSelect = document.getElementById("sortSelect");
        const chips = document.querySelectorAll(".chip");

        let allProducts = [];
        let currentCategory = "all";

        async function loadProducts() {

            const { data, error } = await supabaseClient
                .from("products")
                .select("*")
                .order("created_at", { ascending: false });

            if (error) {
                console.error(error);
                loading.innerHTML = "حدث خطأ أثناء تحميل المنتجات من قاعدة البيانات.";
                return;
            }

            allProducts = data || [];
            if (loading) loading.remove();
            renderProducts(allProducts);
        }

        function renderProducts(products) {

            productsGrid.innerHTML = "";

            if (products.length === 0) {
                noResults.style.display = "block";
                return;
            }

            noResults.style.display = "none";

            const fragment = document.createDocumentFragment();

            products.forEach((product, index) => {

                const card = document.createElement("article");
                card.className = "product-card pop-element";
                
                const delay = Math.min(0.05 * index, 0.4);
                card.style.animationDelay = `${delay}s`;

                let imageHTML = "";

                if (product.image_url) {
                    imageHTML = `
                        <img
                            src="${escapeHTML(product.image_url)}"
                            alt="${escapeHTML(product.name)}"
                            loading="lazy"
                        >
                    `;
                } else {
                    let icon = "fa-tooth";
                    if (product.category === "medicines" || product.category === "medication") icon = "fa-pills";
                    if (product.category === "devices") icon = "fa-lightbulb";
                    if (product.category === "tools") icon = "fa-toolbox";

                    imageHTML = `<i class="fa-solid ${icon}"></i>`;
                }

                let categoryName = "مواد";
                if (product.category === "medicines" || product.category === "medication") categoryName = "أدوية";
                if (product.category === "devices") categoryName = "أجهزة";
                if (product.category === "tools") categoryName = "أدوات";

                card.dataset.category = product.category || "materials";
                card.dataset.name = product.name || "";
                card.dataset.price = product.price || 0;

                card.onclick = () => openProductModal(product, categoryName, imageHTML);

                card.innerHTML = `
                    <div class="product-image">
                        ${imageHTML}
                    </div>

                    <div class="product-info">
                        <div>
                            <div class="product-category">
                                ${categoryName}
                            </div>

                            <h2 class="product-name">
                                ${escapeHTML(product.name)}
                            </h2>

                            <p class="product-description">
                                ${escapeHTML(product.description || "")}
                            </p>
                        </div>

                        <div class="product-bottom">
                            <span class="price">
                                ${Number(product.price).toLocaleString("en-US")} ج.م
                            </span>

                            <button
                                type="button"
                                class="order-btn"
                                data-name="${escapeHTML(product.name)}"
                                data-price="${Number(product.price)}"
                                onclick="event.stopPropagation(); orderProduct(this.dataset.name, this.dataset.price)"
                            >
                                <i class="fa-brands fa-whatsapp"></i>
                                اطلب الآن
                            </button>
                        </div>
                    </div>
                `;

                fragment.appendChild(card);
            });

            productsGrid.appendChild(fragment);
        }

        /* MODAL DETAIL LOGIC */

        const productModal = document.getElementById("productModal");
        const modalImageWrap = document.getElementById("modalImageWrap");
        const modalCategory = document.getElementById("modalCategory");
        const modalTitle = document.getElementById("modalTitle");
        const modalDescription = document.getElementById("modalDescription");
        const modalPrice = document.getElementById("modalPrice");
        const modalOrderBtn = document.getElementById("modalOrderBtn");

        function openProductModal(product, categoryName, imageHTML) {
            modalImageWrap.innerHTML = imageHTML;
            modalCategory.textContent = categoryName;
            modalTitle.textContent = product.name || "";
            modalDescription.textContent = product.description || "لا يوجد وصف إضافي متوفر لهذا المنتج.";
            modalPrice.textContent = `${Number(product.price).toLocaleString("en-US")} ج.م`;

            modalOrderBtn.onclick = () => {
                orderProduct(product.name, product.price);
            };

            productModal.classList.add("active");
            document.body.classList.add("modal-open");
        }

        function closeProductModal(e) {
            if (!e || e.target === productModal || e.target.closest(".modal-close-btn")) {
                productModal.classList.remove("active");
                document.body.classList.remove("modal-open");
            }
        }

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                closeMenu();
                closeProductModal();
            }
        });

        /* FILTER / SEARCH / SORT LOGIC */

        function updateProducts() {

            const searchText = searchInput.value.trim().toLowerCase();
            const cards = Array.from(productsGrid.querySelectorAll(".product-card"));
            let visibleCards = [];

            cards.forEach(card => {
                card.classList.remove("pop-element");
                card.style.animationDelay = "0s";

                const name = (card.dataset.name || "").toLowerCase();
                const category = card.dataset.category;

                const matchesSearch = name.includes(searchText);
                const matchesCategory = currentCategory === "all" || category === currentCategory || 
                                        (currentCategory === "medicines" && category === "medication");

                if (matchesSearch && matchesCategory) {
                    card.style.display = "flex";
                    visibleCards.push(card);
                } else {
                    card.style.display = "none";
                }
            });

            const sortValue = sortSelect.value;

            if (sortValue !== "default") {
                visibleCards.sort((a, b) => {
                    const priceA = Number(a.dataset.price);
                    const priceB = Number(b.dataset.price);

                    return sortValue === "high" ? priceB - priceA : priceA - priceB;
                });

                visibleCards.forEach(card => {
                    productsGrid.appendChild(card);
                });
            }

            noResults.style.display = visibleCards.length === 0 ? "block" : "none";
        }

        searchInput.addEventListener("input", updateProducts);
        sortSelect.addEventListener("change", updateProducts);

        chips.forEach(chip => {
            chip.addEventListener("click", function () {
                chips.forEach(c => c.classList.remove("active"));
                this.classList.add("active");
                currentCategory = this.dataset.category;
                updateProducts();
            });
        });

        /* WHATSAPP ACTION */

        function orderProduct(name, price) {
            const phone = "201223859088";
            const message = `مرحباً، أريد طلب المنتج:\n${name}\nالسعر: ${Number(price).toLocaleString("en-US")} ج.م`;
            const whatsappURL = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
            window.open(whatsappURL, "_blank", "noopener,noreferrer");
        }

        /* UTILS */

        function escapeHTML(text) {
            return String(text || "")
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        loadProducts();

    </script>

</body>

</html>
