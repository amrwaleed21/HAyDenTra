<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAyDenTra® - الصفحة الرئيسية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-bg: #081b33;
            --secondary-bg: #102d4f;
            --accent-glow: #00d2ff;
            --whatsapp-green: #25d366;
            --card-bg: rgba(13, 38, 68, 0.75);
            --text-main: #ffffff;
            --text-muted: #b0c4de;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            background-color: var(--primary-bg);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        body {
            background: linear-gradient(135deg, #081b33 0%, #102d4f 50%, #061527 100%);
            opacity: 0;
            animation: fadeInPage 0.5s ease forwards;
        }

        body.sidebar-open {
            overflow: hidden;
            position: fixed;
            width: 100%;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body.fade-out {
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        /* شريط علوي ثابت */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.6rem 1.2rem;
            background: rgba(8, 27, 51, 0.95);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            border-bottom: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .nav-logo-right {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .nav-logo-right img {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .nav-logo-right .brand-text {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            direction: ltr;
            unicode-bidi: embed;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 38px;
            height: 38px;
            border-radius: 10px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .menu-btn:hover {
            background: rgba(0, 210, 255, 0.2);
            border-color: rgba(0, 210, 255, 0.4);
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: -100%;
            width: 78%;
            height: 100vh;
            height: 100dvh;
            background: linear-gradient(145deg, rgba(16, 45, 79, 0.95) 0%, rgba(8, 27, 51, 0.98) 100%);
            backdrop-filter: blur(18px);
            z-index: 99999;
            padding: 1.5rem 1.2rem;
            transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -20px 0 50px rgba(0, 0, 0, 0.7);
            overflow-y: auto;
            border-left: 1px solid rgba(255, 255, 255, 0.25);
        }

        .sidebar.active {
            right: 0;
        }

        .sidebar-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: rgba(2, 6, 23, 0.65);
            backdrop-filter: blur(4px);
            z-index: 99998;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .sidebar-logo-area {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .sidebar-logo-area img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            padding: 2px;
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
        }

        .sidebar-logo-area .brand-text {
            font-size: 1.1rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.6);
            direction: ltr;
            unicode-bidi: embed;
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            width: 35px;
            height: 35px;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: rgba(255, 0, 0, 0.4);
        }

        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-links a {
            color: #fff;
            text-decoration: none;
            font-size: 1.05rem;
            font-weight: 700;
            background: rgba(255, 255, 255, 0.08);
            padding: 0.85rem 1.1rem;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
        }

        .sidebar-links a:hover,
        .sidebar-links a:active {
            background: rgba(0, 210, 255, 0.25);
            border-color: rgba(0, 210, 255, 0.5);
            padding-right: 1.3rem;
            box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
        }

        /* المحتوى الرئيسي للواجهة الأساسية */
        .hero-container {
            max-width: 700px;
            margin: 5rem auto 2rem auto;
            padding: 1.5rem 1.2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .hero-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-bottom: 1.2rem;
        }

        .hero-logo-box img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #fff;
            padding: 4px;
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.7);
            animation: pulseLogo 3s infinite ease-in-out;
        }

        @keyframes pulseLogo {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 210, 255, 0.6); }
            50% { box-shadow: 0 0 35px rgba(0, 210, 255, 0.9); }
        }

        .hero-logo-box .brand-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.7);
            direction: ltr;
            unicode-bidi: embed;
        }

        .hero-subtitle {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 2.2rem;
            font-weight: 600;
        }

        .hero-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 380px;
            margin-bottom: 2.5rem;
        }

        .action-main-btn {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.2), rgba(0, 150, 200, 0.3));
            color: #fff;
            border: 1px solid rgba(0, 210, 255, 0.5);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 210, 255, 0.25);
            transition: 0.25s ease;
        }

        .action-main-btn:hover {
            background: linear-gradient(135deg, rgba(0, 210, 255, 0.35), rgba(0, 150, 200, 0.5));
            border-color: var(--accent-glow);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        .action-secondary-btn {
            background: rgba(13, 38, 68, 0.75);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 800;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
            transition: 0.25s ease;
        }

        .action-secondary-btn:hover {
            background: rgba(37, 211, 102, 0.2);
            border-color: rgba(37, 211, 102, 0.5);
            color: var(--whatsapp-green);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.3);
            transform: translateY(-2px);
        }

        /* بطاقات الميزات السفلية */
        .features-card-container {
            background: #ffffff;
            color: #081b33;
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            padding: 1.2rem 1rem;
            display: flex;
            justify-content: space-around;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-bottom: 1.5rem;
        }

        .feature-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            flex: 1;
            padding: 0 5px;
        }

        .feature-item i {
            font-size: 1.4rem;
            color: #0096c7;
            margin-bottom: 0.4rem;
        }

        .feature-title {
            font-size: 0.85rem;
            font-weight: 900;
            color: #081b33;
            margin-bottom: 0.15rem;
        }

        .feature-desc {
            font-size: 0.7rem;
            color: #555;
            font-weight: 600;
        }

        footer {
            text-align: center;
            padding: 1.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index.html" class="nav-logo-right">
            <img src="logo.png" alt="HAyDenTra Logo">
            <span class="brand-text">HAyDenTra®</span>
        </a>
        <button class="menu-btn" id="openSidebar"><i class="fa-solid fa-bars"></i></button>
    </nav>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="index.html" class="sidebar-logo-area">
                <img src="logo.png" alt="HAyDenTra Logo">
                <span class="brand-text">HAyDenTra®</span>
            </a>
            <button class="close-btn" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="sidebar-links">
            <a href="index.html">الرئيسية</a>
            <a href="products.html">المنتجات والمستلزمات</a>
            <a href="contact.html">تواصل معنا</a>
        </div>
    </div>

    <div class="hero-container">
        <div class="hero-logo-box">
            <img src="logo.png" alt="HAyDenTra Logo">
            <h1 class="brand-title">HAyDenTra®</h1>
        </div>
        <p class="hero-subtitle">Your Trusted Partner in Dental Solutions</p>

        <div class="hero-actions">
            <a href="products.html" class="action-main-btn">
                <i class="fa-solid fa-box-open"></i> عرض المنتجات والمستلزمات
            </a>
            <a href="https://wa.me/201223859088" target="_blank" class="action-secondary-btn">
                <i class="fa-brands fa-whatsapp" style="color: var(--whatsapp-green); font-size: 1.2rem;"></i> تواصل معنا مباشرة
            </a>
        </div>

        <div class="features-card-container">
            <div class="feature-item">
                <i class="fa-solid fa-headset"></i>
                <span class="feature-title">خدمة العملاء</span>
                <span class="feature-desc">تجاوب فوري</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-truck-fast"></i>
                <span class="feature-title">توصيل سريع</span>
                <span class="feature-desc">شحن مباشر</span>
            </div>
            <div class="feature-item">
                <i class="fa-solid fa-shield-halved"></i>
                <span class="feature-title">جودة عالية</span>
                <span class="feature-desc">خامات معتمدة</span>
            </div>
        </div>

        <footer>HAyDenTra® - Dental Supplies & Solutions</footer>
    </div>

    <script>
        const openSidebar = document.getElementById('openSidebar');
        const closeSidebar = document.getElementById('closeSidebar');
        const sidebar = document.getElementById('sidebar');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        function toggleSidebar(open) {
            if (open) {
                sidebar.classList.add('active');
                sidebarOverlay.classList.add('active');
                document.body.classList.add('sidebar-open');
            } else {
                sidebar.classList.remove('active');
                sidebarOverlay.classList.remove('active');
                document.body.classList.remove('sidebar-open');
            }
        }

        if (openSidebar) openSidebar.addEventListener('click', () => toggleSidebar(true));
        if (closeSidebar) closeSidebar.addEventListener('click', () => toggleSidebar(false));
        if (sidebarOverlay) sidebarOverlay.addEventListener('click', () => toggleSidebar(false));

        document.querySelectorAll('a').forEach(link => {
            link.addEventListener('click', function (e) {
                const href = this.getAttribute('href');
                if (href && href !== '#' && !href.startsWith('http') && !href.startsWith('#')) {
                    e.preventDefault();
                    document.body.classList.add('fade-out');
                    setTimeout(() => { window.location.href = href; }, 400);
                }
            });
        });
    </script>
</body>

</html>
