<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAyDenTra® - Your Trusted Partner in Dental Solutions</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: linear-gradient(180deg, #071224 0%, #0c203b 50%, #06101e 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* الشريط العلوي الثابت */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 1000;
            background: rgba(7, 18, 36, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .menu-btn {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            cursor: pointer;
        }

        .brand-header {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            font-weight: bold;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
        }

        .brand-header img {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* المحتوى الرئيسي */
        .content-wrapper {
            margin-top: 100px;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        /* اللوجو الدائري المتوهج باستخدام صورة png */
        .glowing-logo-box {
            width: 110px;
            height: 110px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            /* تأثير التوهج الأزرق المطلوب (Glowing) */
            box-shadow: 0 0 35px rgba(56, 189, 248, 0.8), 0 0 15px rgba(255, 255, 255, 0.9);
            margin-bottom: 20px;
            overflow: hidden;
        }

        .glowing-logo-box img {
            width: 85%;
            height: 85%;
            object-fit: contain;
        }

        .site-title {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 6px;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .site-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-bottom: 30px;
        }

        /* زر عرض المستلزمات والتواصل */
        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: 1px solid rgba(56, 189, 248, 0.5);
            padding: 14px;
            border-radius: 35px;
            font-size: 1.05rem;
            font-weight: bold;
            text-decoration: none;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.4);
            margin-bottom: 12px;
            transition: transform 0.2s ease;
        }

        .action-btn.contact-btn {
            background: rgba(12, 32, 59, 0.8);
            border-color: rgba(56, 189, 248, 0.3);
            box-shadow: none;
        }

        .action-btn:hover {
            transform: scale(1.02);
        }

        /* بطاقات المميزات البيضاء السفلى */
        .features-container {
            background: #ffffff;
            color: #0f172a;
            width: 100%;
            border-radius: 20px;
            padding: 18px 10px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            margin-top: 25px;
            margin-bottom: 30px;
        }

        .feature-box {
            flex: 1;
            padding: 0 4px;
        }

        .feature-box .f-icon {
            font-size: 1.4rem;
            margin-bottom: 4px;
        }

        .feature-box h4 {
            font-size: 0.85rem;
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 2px;
        }

        .feature-box p {
            font-size: 0.7rem;
            color: #64748b;
        }

        /* قسم مستلزمات وتجهيز العيادات الإضافي بالأسفل */
        .section-title-box {
            text-align: center;
            margin-top: 15px;
            margin-bottom: 15px;
        }

        .section-title-box h2 {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .section-title-box p {
            font-size: 0.85rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header class="navbar">
        <button class="menu-btn">☰</button>
        <div class="brand-header">
            <span>®HAyDenTra</span>
            <img src="logo.png" alt="Logo">
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <div class="content-wrapper">
        <!-- اللوجو الدائري المتوهج (Glowing Logo) -->
        <div class="glowing-logo-box">
            <img src="logo.png" alt="HAyDenTra Logo">
        </div>

        <h1 class="site-title">HAyDenTra</h1>
        <p class="site-subtitle">Your Trusted Partner in Dental Solutions</p>

        <!-- أزرار التوجيه -->
        <a href="products.html" class="action-btn">
            <span>←</span> عرض مستلزمات العيادة
        </a>
        <a href="contact.html" class="action-btn contact-btn">
            <span>📞</span> تواصل معنا مباشرة
        </a>

        <!-- البطاقات البيضاء -->
        <div class="features-container">
            <div class="feature-box">
                <div class="f-icon">🎧</div>
                <h4>خدمة العملاء</h4>
                <p>دعم واستجابة</p>
            </div>
            <div class="feature-box">
                <div class="f-icon">🚚</div>
                <h4>توصيل سريع</h4>
                <p>لكافة العيادات</p>
            </div>
            <div class="feature-box">
                <div class="f-icon">🛡️</div>
                <h4>جودة عالية</h4>
                <p>خامات معتمدة</p>
            </div>
        </div>

        <div class="section-title-box">
            <h2>مستلزمات وتجهيز العيادات</h2>
            <p>اختر ما تحتاجه لعيادتك واطلبه فوراً عبر الواتساب</p>
        </div>
    </div>

</body>
</html>
