<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>HAyDenTra® | المنتجات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            min-height: 100%;
            background: linear-gradient(180deg, #ffffff 0%, #e6f4f8 50%, #d8eff6 100%);
            scroll-behavior: smooth;
        }

        body {
            min-height: 100dvh;
            font-family: "Cairo", sans-serif;
            color: #1e3a8a;
            background:
                radial-gradient(circle at 50% 28%, rgba(186, 230, 253, 0.4), transparent 45%),
                linear-gradient(180deg, #ffffff 0%, #e8f5f9 50%, #dbeffe 100%);
            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        /* =========================
           NAVBAR
        ========================= */

        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 74px;
            z-index: 1000;

            background: rgba(255, 255, 255, 0.85);
            border-bottom: 1px solid rgba(186, 230, 253, 0.6);

            backdrop-filter: blur(18px) saturate(150%);
            -webkit-backdrop-filter: blur(18px) saturate(150%);

            box-shadow: 0 4px 20px rgba(186, 230, 253, 0.3);
        }

        .nav-inner {
            height: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
        }

        .nav-logo-circle {
            width: 50px;
            height: 50px;
            flex-shrink: 0;

            border-radius: 50%;
            background: #fff;

            display: grid;
            place-items: center;

            border: 1px solid rgba(14, 165, 233, 0.3);

            box-shadow:
                0 0 8px rgba(186, 230, 253, 0.8),
                0 0 15px rgba(56, 189, 248, 0.2);
        }

        .nav-logo-circle img {
            width: 72%;
            height: 72%;
            object-fit: contain;
        }

        .brand-name {
            position: relative;
            display: inline-block;

            font-family: Arial, sans-serif;
            font-weight: 900;
            font-size: 27px;
            line-height: 1;
            color: #0284c7;
            white-space: nowrap;
        }

        .brand-name .registered {
            position: absolute;
            top: -7px;
            right: -9px;

            font-family: Arial, sans-serif;
            font-size: 10px;
            line-height: 1;
            font-weight: 700;
        }

        .menu-btn {
            width: 58px;
            height: 58px;

            border-radius: 18px;
            border: 1px solid rgba(14, 165, 233, 0.2);

            background: rgba(240, 249, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            color: #0284c7;
            font-size: 31px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 4px 15px rgba(186, 230, 253, 0.3),
                inset 0 1px rgba(255, 255, 255, 0.8);

            transition: .25s;
        }

        .menu-btn:hover {
            background: rgba(224, 242, 254, 0.9);
            transform: translateY(-1px);
        }

        /* =========================
           SIDEBAR
        ========================= */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1050;

            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);

            opacity: 0;
            visibility: hidden;

            transition: .3s;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;

            width: min(80%, 350px);
            height: 100dvh;

            z-index: 1100;

            padding: 28px 20px;

            background: rgba(255, 255, 255, 0.92);
            border-left: 1px solid rgba(186, 230, 253, 0.5);

            backdrop-filter: blur(24px) saturate(160%);
            -webkit-backdrop-filter: blur(24px) saturate(160%);

            box-shadow: -10px 0 35px rgba(186, 230, 253, 0.4);

            transform: translateX(110%);
            transition: transform .35s ease;

            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            padding-bottom: 25px;
            margin-bottom: 20px;

            border-bottom: 1px solid rgba(186, 230, 253, 0.5);
        }

        .sidebar-logo {
            width: 72px;
            height: 72px;

            border-radius: 50%;
            background: #fff;

            display: grid;
            place-items: center;

            box-shadow:
                0 0 10px rgba(186, 230, 253, 0.8),
                0 0 20px rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .sidebar-logo img {
            width: 72%;
            height: 72%;
            object-fit: contain;
        }

        .sidebar-brand {
            margin-top: 13px;

            position: relative;
            display: inline-block;

            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: 900;
            direction: ltr;
            color: #0284c7;
        }

        .sidebar-brand .registered {
            position: absolute;
            top: -5px;
            right: -8px;
            font-size: 9px;
        }

        .close-btn {
            position: absolute;
            top: 18px;
            left: 18px;

            width: 42px;
            height: 42px;

            border-radius: 50%;
            border: 1px solid rgba(14, 165, 233, 0.2);

            background: rgba(240, 249, 255, 0.8);
            color: #0284c7;

            font-size: 20px;
            cursor: pointer;
        }

        .side-link {
            display: flex;
            align-items: center;
            gap: 14px;

            padding: 15px 16px;
            margin-bottom: 10px;

            border-radius: 15px;

            background: rgba(240, 249, 255, 0.6);
            border: 1px solid rgba(186, 230, 253, 0.5);

            font-size: 16px;
            font-weight: 700;
            color: #0369a1;

            transition: .25s;
        }

        .side-link i {
            width: 25px;
            text-align: center;
            color: #0284c7;
        }

        .side-link:hover,
        .side-link.active {
            background: #e0f2fe;
            border-color: #38bdf8;
            color: #0284c7;
            transform: translateX(-3px);
        }

        /* =========================
           MAIN & PARALLAX SEARCH HEADER
        ========================= */

        main {
            padding-top: 74px;
        }

        .products-hero {
            position: relative;
            width: 100%;
            padding: 45px 18px 25px;
            text-align: center;
            overflow: hidden;
        }

        /* تم تنزيل الصورة لأسفل قليلاً وتوضيحها وزيادة نسبة الرؤية */
        .search-bg-full {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            height: 110%;
            background: url("searchbarbg.jpg") center top/cover no-repeat;
            opacity: 0.95;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .search-bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(224, 242, 254, 0.15) 100%);
            z-index: 0;
            pointer-events: none;
        }

        .search-container {
            position: relative;
            z-index: 1;
            width: min(92%, 580px);
            margin: 0 auto;
        }

        /* السيرش بار أصبح Glassy شفاف بلوري */
        .search-box {
            display: flex;
            align-items: center;

            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(16px) saturate(160%);
            -webkit-backdrop-filter: blur(16px) saturate(160%);

            border: 1px solid rgba(255, 255, 255, 0.75);
            border-radius: 20px;
            padding: 6px 18px;

            box-shadow: 0 12px 35px rgba(2, 132, 199, 0.15),
                        inset 0 1px 1px rgba(255, 255, 255, 0.8);
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .search-box:focus-within {
            transform: translateY(-2px);
            box-shadow: 0 16px 40px rgba(2, 132, 199, 0.22);
            background: rgba(255, 255, 255, 0.65);
        }

        .search-box i {
            font-size: 19px;
            color: #0284c7;
            margin-left: 10px;
        }

        .search-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;

            font-family: "Cairo", sans-serif;
            font-size: 15px;
            font-weight: 800;
            color: #0f172a;
            padding: 10px 0;
        }

        .search-box input::placeholder {
            color: #334155;
            font-weight: 700;
        }

        /* =========================
           FILTERS SECTION (GLASSY)
        ========================= */

        .filter-container {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;

            margin-top: 15px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 8px 16px;
            border-radius: 12px;

            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.7);
            color: #0369a1;

            font-family: "Cairo", sans-serif;
            font-size: 13px;
            font-weight: 800;

            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;

            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.08);
            transition: all 0.25s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: rgba(2, 132, 199, 0.9);
            color: #ffffff;
            border-color: #0284c7;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.3);
            transform: translateY(-2px);
        }

        /* =========================
           PRODUCTS GRID (2 COLUMNS)
        ========================= */

        .products-section {
            position: relative;
            z-index: 1;
            max-width: 950px;
            margin: 20px auto 40px;
            padding: 0 12px;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        @media (min-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
                gap: 20px;
            }
        }

        @media (min-width: 1024px) {
            .products-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 22px;
            }
        }

        .product-card {
            border-radius: 20px;

            background: rgba(255, 255, 255, 0.72);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            border: 1px solid rgba(255, 255, 255, 0.85);

            box-shadow: 0 8px 22px rgba(186, 230, 253, 0.35);

            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;

            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 30px rgba(2, 132, 199, 0.2);
            background: rgba(255, 255, 255, 0.88);
        }

        .product-img-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1;

            border-radius: 14px;
            background: #ffffff;
            border: 1px solid rgba(186, 230, 253, 0.5);

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
            margin-bottom: 10px;
        }

        .product-img-wrapper img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .product-card:hover .product-img-wrapper img {
            transform: scale(1.05);
        }

        .product-info {
            text-align: center;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .product-title {
            font-size: clamp(13px, 2.8vw, 15px);
            font-weight: 800;
            color: #0f172a;
            line-height: 1.4;
            margin-bottom: 4px;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-price {
            font-size: clamp(12px, 2.5vw, 14px);
            font-weight: 900;
            color: #0284c7;
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: clamp(10px, 2.2vw, 12px);
            font-weight: 600;
            color: #64748b;
            margin-bottom: 12px;
            line-height: 1.5;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-btn {
            width: 100%;
            padding: 10px 12px;

            border-radius: 12px;

            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;

            font-family: "Cairo", sans-serif;
            font-size: 13px;
            font-weight: 800;

            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;

            border: none;
            cursor: pointer;

            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .product-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(2, 132, 199, 0.4);
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            width: 100%;
            padding: 18px 15px 25px;

            text-align: center;

            color: #0369a1;
            font-size: 12px;

            background: rgba(224, 242, 254, 0.5);
            border-top: 1px solid rgba(186, 230, 253, 0.6);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .4;
            background-image: radial-gradient(rgba(14, 165, 233, 0.15) .7px, transparent .7px);
            background-size: 18px 18px;
            mask-image: linear-gradient(to bottom, #000, transparent 80%);
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="nav-inner">

            <div class="nav-brand">
                <div class="nav-logo-circle">
                    <img src="logo.png" alt="HAyDenTra Logo">
                </div>

                <div class="brand-name">
                    HAyDenTra
                    <span class="registered">®</span>
                </div>
            </div>

            <button class="menu-btn" onclick="openMenu()" aria-label="فتح القائمة">
                <i class="fa-solid fa-bars"></i>
            </button>

        </div>
    </header>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">

        <button class="close-btn" onclick="closeMenu()" aria-label="إغلاق">
            <i class="fa-solid fa-xmark"></i>
        </button>

        <div class="sidebar-header">

            <div class="sidebar-logo">
                <img src="logo.png" alt="HAyDenTra Logo">
            </div>

            <div class="sidebar-brand">
                HAyDenTra
                <span class="registered">®</span>
            </div>

        </div>

        <a href="index.html" class="side-link">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>

        <a href="products.html" class="side-link active">
            <i class="fa-solid fa-tooth"></i>
            <span>المنتجات</span>
        </a>

        <a href="contact.html" class="side-link">
            <i class="fa-solid fa-phone"></i>
            <span>تواصل معنا</span>
        </a>

    </aside>

    <main>

        <section class="products-hero">

            <div class="search-bg-full" id="searchBg"></div>
            <div class="search-bg-overlay"></div>

            <div class="search-container" data-aos="zoom-in" data-aos-duration="800">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="ابحث عن أداة، جهاز، أو مادة طبية..."
                        onkeyup="handleSearchAndFilter()">
                </div>

                <div class="filter-container" data-aos="fade-up" data-aos-delay="200">
                    <button class="filter-btn active" id="btnAll" onclick="setSortMode('default')">
                        <i class="fa-solid fa-list-check"></i> الكل
                    </button>
                    <button class="filter-btn" id="btnHigh" onclick="setSortMode('high')">
                        <i class="fa-solid fa-arrow-down-wide-short"></i> الأعلى سعراً
                    </button>
                    <button class="filter-btn" id="btnLow" onclick="setSortMode('low')">
                        <i class="fa-solid fa-arrow-up-wide-short"></i> الأقل سعراً
                    </button>
                </div>
            </div>

        </section>

        <section class="products-section">
            <div class="products-grid" id="productsGrid">
                </div>
        </section>

    </main>

    <footer>
        © 2026 HAyDenTra® - جميع الحقوق محفوظة
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>

    <script>
        // تفعيل مكتبة الظهور Pop-Up
        AOS.init({
            once: true,
            easing: 'ease-out-cubic'
        });

        // ===============================================
        //  DATABASE PRODUCTS ARRAY (يمكنك استبدالها بـ fetch من الـ Database)
        // ===============================================
        let productsData = [
            {
                id: 1,
                title: "قبضة أسنان عالية السرعة (High Speed)",
                price: 3500,
                image: "logo.png",
                desc: "أداء عالي وإضاءة LED مع نظام تبريد ثلاثي متطور."
            },
            {
                id: 2,
                title: "جهاز حشو العصب (Endo Motor)",
                price: 8200,
                image: "logo.png",
                desc: "دقة متناهية وإعدادات مسبقة لجميع أنواع المبرد."
            },
            {
                id: 3,
                title: "جهاز تبييض الأسنان الضوئي",
                price: 5400,
                image: "logo.png",
                desc: "تقنية ضوئية حديثة لتبييض سريع وآمن للعيادات."
            },
            {
                id: 4,
                title: "مستلزمات الحشوات Composite",
                price: 1200,
                image: "logo.png",
                desc: "مجموعة حشوات عالية الجودة ومقاومة للتآكل."
            }
        ];

        let currentSortMode = 'default';

        // دالة بناء وعرض المنتجات ديناميكياً
        function renderProducts(data) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; font-weight:700; padding: 20px;">لا توجد منتجات مطابقة للبحث.</p>`;
                return;
            }

            data.forEach((product, index) => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('data-aos', 'fade-up');
                card.setAttribute('data-aos-delay', (index * 80).toString());

                card.innerHTML = `
                    <div class="product-img-wrapper">
                        <img src="${product.image}" alt="${product.title}">
                    </div>
                    <div class="product-info">
                        <div>
                            <h3 class="product-title">${product.title}</h3>
                            <div class="product-price">${product.price.toLocaleString()} ج.م</div>
                            <p class="product-desc">${product.desc}</p>
                        </div>
                        <a href="contact.html" class="product-btn">
                            <i class="fa-solid fa-cart-plus"></i>
                            طلب المنتج
                        </a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // دالة الفلترة والبحث والترتيب
        function handleSearchAndFilter() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = productsData.filter(p => 
                p.title.toLowerCase().includes(query) || 
                p.desc.toLowerCase().includes(query)
            );

            if (currentSortMode === 'high') {
                filtered.sort((a, b) => b.price - a.price);
            } else if (currentSortMode === 'low') {
                filtered.sort((a, b) => a.price - b.price);
            }

            renderProducts(filtered);
        }

        // تغيير وضع الفلتر وتنشيط الأزرار
        function setSortMode(mode) {
            currentSortMode = mode;

            document.getElementById('btnAll').classList.remove('active');
            document.getElementById('btnHigh').classList.remove('active');
            document.getElementById('btnLow').classList.remove('active');

            if (mode === 'default') document.getElementById('btnAll').classList.add('active');
            if (mode === 'high') document.getElementById('btnHigh').classList.add('active');
            if (mode === 'low') document.getElementById('btnLow').classList.add('active');

            handleSearchAndFilter();
        }

        // التشغيل الأولي عند فتح الصفحة
        window.addEventListener('DOMContentLoaded', () => {
            renderProducts(productsData);
        });

        // القائمة الجانبية
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        function openMenu() {
            sidebar.classList.add("active");
            overlay.classList.add("active");
            document.body.classList.add("menu-open");
        }

        function closeMenu() {
            sidebar.classList.remove("active");
            overlay.classList.remove("active");
            document.body.classList.remove("menu-open");
        }

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                closeMenu();
            }
        });

        // تأثير Parallax ناعم لخلفية السيرش بار
        const searchBg = document.getElementById('searchBg');
        let latestScrollY = 0;
        let ticking = false;

        function updateSearchParallax() {
            const speed = 0.25;
            const yPos = -(latestScrollY * speed);
            if (searchBg) {
                searchBg.style.transform = `translate3d(0, ${yPos}px, 0)`;
            }
            ticking = false;
        }

        window.addEventListener('scroll', function () {
            latestScrollY = window.scrollY;
            if (!ticking) {
                window.requestAnimationFrame(updateSearchParallax);
                ticking = true;
            }
        });
    </script>

</body>

</html>
