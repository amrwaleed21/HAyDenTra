<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HAyDenTra® | المنتجات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --blue: #0066FF;
            --blue-dark: #0A2540;
            --bg: #F4F6F8;
            --white: #FFFFFF;
            --border: #E1E6EB;
            --muted: #64748B;
        }

        html {
            min-height: 100%;
            background: var(--bg);
        }

        body {
            min-height: 100dvh;
            font-family: "Cairo", sans-serif;
            color: var(--blue-dark);

            background:
                radial-gradient(
                    circle at 80% 5%,
                    rgba(0,102,255,.06),
                    transparent 28%
                ),
                linear-gradient(
                    180deg,
                    #fff 0%,
                    #f4f6f8 100%
                );

            overflow-x: hidden;
        }

        body.menu-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* NAVBAR */

        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;

            height: 74px;
            z-index: 1000;

            background: rgba(255,255,255,.88);
            border-bottom: 1px solid var(--border);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            box-shadow: 0 4px 20px rgba(10,37,64,.06);
        }

        .nav-inner {
            height: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 18px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            direction: ltr;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
        }

        .nav-logo-circle {
            width: 48px;
            height: 48px;

            border-radius: 50%;
            background: #fff;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);
            box-shadow: 0 5px 16px rgba(10,37,64,.10);
        }

        .nav-logo-circle img {
            width: 72%;
            height: 72%;
            object-fit: contain;
        }

        .brand-name {
            position: relative;

            font-family: Arial, sans-serif;
            font-size: 27px;
            font-weight: 900;
            line-height: 1;

            color: var(--blue-dark);
            direction: ltr;
        }

        .brand-name .registered {
            position: absolute;
            top: -7px;
            right: -9px;
            font-size: 10px;
        }

        .menu-btn {
            width: 50px;
            height: 50px;

            border-radius: 12px;
            border: 1px solid var(--border);

            background: #fff;
            color: var(--blue-dark);

            font-size: 23px;

            display: flex;
            align-items: center;
            justify-content: center;

            cursor: pointer;

            box-shadow: 0 5px 16px rgba(10,37,64,.07);
        }

        /* SIDEBAR */

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1050;

            background: rgba(10,37,64,.25);
            backdrop-filter: blur(4px);

            opacity: 0;
            visibility: hidden;

            transition: .3s;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;

            width: min(82%,350px);
            height: 100dvh;

            z-index: 1100;

            padding: 28px 20px;

            background: rgba(255,255,255,.93);
            border-left: 1px solid var(--border);

            backdrop-filter: blur(22px);

            box-shadow: -15px 0 45px rgba(10,37,64,.12);

            transform: translateX(110%);
            transition: transform .35s ease;

            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;

            padding-bottom: 25px;
            margin-bottom: 20px;

            border-bottom: 1px solid var(--border);
        }

        .sidebar-logo {
            width: 72px;
            height: 72px;

            border-radius: 50%;
            background: #fff;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);
            box-shadow: 0 8px 24px rgba(10,37,64,.10);
        }

        .sidebar-logo img {
            width: 72%;
            height: 72%;
            object-fit: contain;
        }

        .sidebar-brand {
            position: relative;
            margin-top: 13px;

            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: 900;

            color: var(--blue-dark);
            direction: ltr;
        }

        .sidebar-brand .registered {
            position: absolute;
            top: -5px;
            right: -8px;
            font-size: 9px;
        }

        .close-btn {
            position: absolute;
            top: 18px;
            left: 18px;

            width: 42px;
            height: 42px;

            border-radius: 12px;
            border: 1px solid var(--border);

            background: #fff;
            color: var(--blue-dark);

            font-size: 20px;
            cursor: pointer;
        }

        .side-link {
            display: flex;
            align-items: center;
            gap: 14px;

            padding: 15px 16px;
            margin-bottom: 10px;

            border-radius: 12px;

            background: #F4F6F8;
            border: 1px solid var(--border);

            color: var(--blue-dark);

            font-size: 16px;
            font-weight: 700;

            transition: .25s;
        }

        .side-link i {
            width: 25px;
            text-align: center;
            color: var(--blue);
        }

        .side-link:hover,
        .side-link.active {
            background: rgba(0,102,255,.07);
            border-color: rgba(0,102,255,.25);
            color: var(--blue);
        }

        /* MAIN */

        main {
            padding-top: 74px;
        }

        .page-header {
            text-align: center;
            padding: 58px 18px 25px;
        }

        .main-logo-circle {
            width: 82px;
            height: 82px;

            margin: 0 auto;

            border-radius: 50%;
            background: #fff;

            display: grid;
            place-items: center;

            border: 1px solid var(--border);

            box-shadow: 0 12px 30px rgba(10,37,64,.10);
        }

        .main-logo-circle img {
            width: 70%;
            height: 70%;
            object-fit: contain;
        }

        .main-brand {
            position: relative;
            display: inline-block;

            margin-top: 18px;

            font-family: Arial, sans-serif;
            font-size: 38px;
            font-weight: 900;

            direction: ltr;
            color: var(--blue-dark);
        }

        .main-brand .registered {
            position: absolute;
            top: -6px;
            right: -10px;
            font-size: 13px;
        }

        .page-header h1 {
            margin-top: 25px;

            font-size: clamp(25px,6vw,38px);
            font-weight: 900;
        }

        .page-header p {
            margin-top: 8px;
            color: var(--muted);
            font-size: 15px;
        }

        /* FILTERS */

        .filters {
            width: min(100% - 30px,1000px);

            margin: 25px auto;

            padding: 18px;

            border-radius: 14px;

            background: rgba(255,255,255,.88);
            border: 1px solid var(--border);

            backdrop-filter: blur(14px);

            box-shadow: 0 8px 25px rgba(10,37,64,.06);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 190px;
            gap: 10px;
        }

        .search-box,
        .sort-select {
            width: 100%;

            padding: 13px 15px;

            border-radius: 11px;
            border: 1px solid var(--border);

            background: #fff;
            color: var(--blue-dark);

            font-family: "Cairo", sans-serif;
            font-size: 14px;

            outline: none;

            transition: .2s;
        }

        .search-box:focus,
        .sort-select:focus {
            border-color: rgba(0,102,255,.45);
            box-shadow: 0 0 0 3px rgba(0,102,255,.07);
        }

        .search-box::placeholder {
            color: #9AA5AF;
        }

        .sort-select option {
            color: #000;
        }

        .chips {
            display: flex;
            gap: 8px;

            margin-top: 12px;

            overflow-x: auto;
            padding-bottom: 2px;
        }

        .chip {
            flex-shrink: 0;

            padding: 8px 17px;

            border-radius: 50px;

            border: 1px solid var(--border);
            background: #F4F6F8;

            color: #64748B;

            font-family: "Cairo", sans-serif;
            font-size: 12px;
            font-weight: 700;

            cursor: pointer;

            transition: .2s;
        }

        .chip:hover {
            border-color: rgba(0,102,255,.25);
            color: var(--blue);
        }

        .chip.active {
            background: var(--blue);
            border-color: var(--blue);
            color: #fff;

            box-shadow: 0 6px 15px rgba(0,102,255,.18);
        }

        /* PRODUCTS */

        .products-grid {
            width: min(100% - 30px,1100px);

            margin: 25px auto 40px;

            display: grid;

            grid-template-columns:
                repeat(auto-fit,minmax(250px,1fr));

            gap: 18px;
        }

        .product-card {
            overflow: hidden;

            border-radius: 14px;

            background: #fff;
            color: var(--blue-dark);

            border: 1px solid var(--border);

            box-shadow:
                0 8px 25px rgba(10,37,64,.07);

            transition: .25s;
        }

        .product-card:hover {
            transform: translateY(-4px);

            box-shadow:
                0 15px 35px rgba(10,37,64,.11);

            border-color: rgba(0,102,255,.16);
        }

        .product-image {
            height: 200px;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                linear-gradient(
                    135deg,
                    #F8FAFC,
                    #EDF2F7
                );

            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-image i {
            font-size: 60px;
            color: #AAB7C4;
        }

        .product-info {
            padding: 18px;
        }

        .product-category {
            display: inline-block;

            padding: 4px 9px;

            border-radius: 50px;

            background: rgba(0,102,255,.07);
            color: var(--blue);

            font-size: 10px;
            font-weight: 800;
        }

        .product-name {
            margin-top: 8px;

            font-size: 18px;
            line-height: 1.5;
            font-weight: 900;
        }

        .product-description {
            margin-top: 8px;

            color: var(--muted);

            font-size: 12px;
            line-height: 1.7;

            min-height: 41px;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 10px;
            margin-top: 17px;
        }

        .price {
            font-size: 18px;
            font-weight: 900;
            color: var(--blue-dark);
        }

        .order-btn {
            border: 0;

            padding: 10px 14px;

            border-radius: 11px;

            background: #18B96D;
            color: #fff;

            font-family: "Cairo", sans-serif;
            font-size: 12px;
            font-weight: 900;

            cursor: pointer;

            box-shadow: 0 7px 16px rgba(24,185,109,.17);

            transition: .2s;
        }

        .order-btn:hover {
            transform: translateY(-2px);
            background: #12A861;
        }

        .order-btn i {
            margin-left: 5px;
        }

        .loading {
            width: 100%;

            margin: 40px auto;

            text-align: center;
            color: var(--muted);
        }

        .no-results {
            text-align: center;

            color: var(--muted);

            padding: 40px 20px;

            display: none;
        }

        footer {
            width: 100%;

            padding: 20px 15px 25px;

            text-align: center;

            color: #82909D;
            font-size: 12px;

            background: #fff;
            border-top: 1px solid var(--border);
        }

        @media(max-width:600px) {

            .nav-inner {
                padding: 0 18px;
            }

            .nav-logo-circle {
                width: 46px;
                height: 46px;
            }

            .brand-name {
                font-size: 24px;
            }

            .menu-btn {
                width: 48px;
                height: 48px;
            }

            .page-header {
                padding-top: 45px;
            }

            .main-logo-circle {
                width: 78px;
                height: 78px;
            }

            .main-brand {
                font-size: 35px;
            }

            .filter-row {
                grid-template-columns: 1fr;
            }

            .products-grid {
                grid-template-columns: 1fr;
            }
        }

        @media(max-width:360px) {

            .brand-name {
                font-size: 21px;
            }

            .main-brand {
                font-size: 31px;
            }
        }
    </style>
</head>

<body>

<header class="topbar">

    <div class="nav-inner">

        <div class="nav-brand">

            <div class="nav-logo-circle">
                <img src="logo.png" alt="HAyDenTra Logo">
            </div>

            <div class="brand-name">
                HAyDenTra
                <span class="registered">®</span>
            </div>

        </div>

        <button class="menu-btn"
                onclick="openMenu()"
                aria-label="فتح القائمة">

            <i class="fa-solid fa-bars"></i>

        </button>

    </div>

</header>

<div class="overlay"
     id="overlay"
     onclick="closeMenu()"></div>

<aside class="sidebar" id="sidebar">

    <button class="close-btn"
            onclick="closeMenu()">

        <i class="fa-solid fa-xmark"></i>

    </button>

    <div class="sidebar-header">

        <div class="sidebar-logo">
            <img src="logo.png" alt="HAyDenTra Logo">
        </div>

        <div class="sidebar-brand">
            HAyDenTra
            <span class="registered">®</span>
        </div>

    </div>

    <a href="index.html" class="side-link">

        <i class="fa-solid fa-house"></i>
        <span>الرئيسية</span>

    </a>

    <a href="products.html" class="side-link active">

        <i class="fa-solid fa-tooth"></i>
        <span>المنتجات</span>

    </a>

    <a href="contact.html" class="side-link">

        <i class="fa-solid fa-phone"></i>
        <span>تواصل معنا</span>

    </a>

</aside>

<main>

    <section class="page-header">

        <div class="main-logo-circle">
            <img src="logo.png" alt="HAyDenTra Logo">
        </div>

        <div class="main-brand">
            HAyDenTra
            <span class="registered">®</span>
        </div>

        <h1>
            منتجات ومستلزمات الأسنان
        </h1>

        <p>
            مجموعة مختارة من المواد والأجهزة والأدوات الطبية
        </p>

    </section>

    <section class="filters">

        <div class="filter-row">

            <input
                type="text"
                id="searchInput"
                class="search-box"
                placeholder="ابحث عن منتج..."
            >

            <select id="sortSelect"
                    class="sort-select">

                <option value="default">
                    ترتيب المنتجات
                </option>

                <option value="high">
                    السعر: من الأعلى للأقل
                </option>

                <option value="low">
                    السعر: من الأقل للأعلى
                </option>

            </select>

        </div>

        <div class="chips">

            <button class="chip active"
                    data-category="all">
                الكل
            </button>

            <button class="chip"
                    data-category="materials">
                المواد
            </button>

            <button class="chip"
                    data-category="devices">
                الأجهزة
            </button>

            <button class="chip"
                    data-category="tools">
                الأدوات
            </button>

        </div>

    </section>

    <section class="products-grid"
             id="productsGrid">

        <div class="loading"
             id="loading">
            جاري تحميل المنتجات...
        </div>

    </section>

    <div class="no-results"
         id="noResults">
        لا توجد منتجات مطابقة للبحث.
    </div>

</main>

<footer>
    © 2026 HAyDenTra® - جميع الحقوق محفوظة
</footer>

<script>

    const SUPABASE_URL =
        "https://hcvajgyjiflkcsdjvzib.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_NhB5QvshhLY4rPpOTLjGXw_dBjCbSOW";

    const supabase =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );

    let allProducts = [];
    let currentCategory = "all";

    const sidebar =
        document.getElementById("sidebar");

    const overlay =
        document.getElementById("overlay");

    function openMenu() {
        sidebar.classList.add("active");
        overlay.classList.add("active");
        document.body.classList.add("menu-open");
    }

    function closeMenu() {
        sidebar.classList.remove("active");
        overlay.classList.remove("active");
        document.body.classList.remove("menu-open");
    }

    document.addEventListener("keydown", function(e) {

        if (e.key === "Escape") {
            closeMenu();
        }

    });

    function escapeHTML(text) {

        return String(text ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }

    function getCategoryName(category) {

        const names = {
            materials: "المواد",
            devices: "الأجهزة",
            tools: "الأدوات"
        };

        return names[category] || category;

    }

    function orderProduct(name, price) {

        const phone =
            "201223859088";

        const message =
            `مرحباً، أريد طلب المنتج:\n${name}\nالسعر: ${Number(price).toLocaleString("en-US")} ج.م`;

        const whatsappURL =
            "https://api.whatsapp.com/send?phone=" +
            phone +
            "&text=" +
            encodeURIComponent(message);

        window.location.href =
            whatsappURL;

    }

    function renderProducts(products) {

        const grid =
            document.getElementById("productsGrid");

        const noResults =
            document.getElementById("noResults");

        if (!products.length) {

            grid.innerHTML = "";
            noResults.style.display = "block";

            return;
        }

        noResults.style.display = "none";

        grid.innerHTML =
            products.map(product => {

                const imageHTML =
                    product.image_url
                        ? `
                            <img
                                src="${escapeHTML(product.image_url)}"
                                alt="${escapeHTML(product.name)}"
                            >
                          `
                        : `
                            <i class="fa-solid fa-tooth"></i>
                          `;

                return `
                    <article class="product-card">

                        <div class="product-image">
                            ${imageHTML}
                        </div>

                        <div class="product-info">

                            <span class="product-category">
                                ${escapeHTML(
                                    getCategoryName(product.category)
                                )}
                            </span>

                            <h2 class="product-name">
                                ${escapeHTML(product.name)}
                            </h2>

                            <p class="product-description">
                                ${escapeHTML(
                                    product.description || "لا يوجد وصف للمنتج."
                                )}
                            </p>

                            <div class="product-bottom">

                                <div class="price">
                                    ${Number(product.price).toLocaleString("en-US")}
                                    ج.م
                                </div>

                                <button
                                    class="order-btn"
                                    onclick="orderProduct(
                                        ${JSON.stringify(product.name)},
                                        ${Number(product.price)}
                                    )"
                                >
                                    <i class="fa-brands fa-whatsapp"></i>
                                    اطلب الآن
                                </button>

                            </div>

                        </div>

                    </article>
                `;

            }).join("");

    }

    function updateProducts() {

        const search =
            document.getElementById("searchInput")
                .value
                .trim()
                .toLowerCase();

        const sort =
            document.getElementById("sortSelect")
                .value;

        let products =
            allProducts.filter(product => {

                const matchesCategory =
                    currentCategory === "all" ||
                    product.category === currentCategory;

                const searchable =
                    (
                        product.name +
                        " " +
                        (product.description || "")
                    ).toLowerCase();

                const matchesSearch =
                    !search ||
                    searchable.includes(search);

                return matchesCategory &&
                       matchesSearch;

            });

        if (sort === "high") {

            products.sort(
                (a,b) =>
                    Number(b.price) -
                    Number(a.price)
            );

        }

        if (sort === "low") {

            products.sort(
                (a,b) =>
                    Number(a.price) -
                    Number(b.price)
            );

        }

        renderProducts(products);

    }

    async function loadProducts() {

        const loading =
            document.getElementById("loading");

        const {
            data,
            error
        } = await supabase
            .from("products")
            .select("*")
            .order("created_at", {
                ascending: false
            });

        if (error) {

            loading.textContent =
                "حدث خطأ أثناء تحميل المنتجات.";

            console.error(error);

            return;
        }

        allProducts = data || [];

        loading.remove();

        updateProducts();

    }

    document
        .getElementById("searchInput")
        .addEventListener(
            "input",
            updateProducts
        );

    document
        .getElementById("sortSelect")
        .addEventListener(
            "change",
            updateProducts
        );

    document
        .querySelectorAll(".chip")
        .forEach(chip => {

            chip.addEventListener(
                "click",
                function() {

                    document
                        .querySelectorAll(".chip")
                        .forEach(item =>
                            item.classList.remove("active")
                        );

                    this.classList.add("active");

                    currentCategory =
                        this.dataset.category;

                    updateProducts();

                }
            );

        });

    loadProducts();

</script>

</body>
</html>
