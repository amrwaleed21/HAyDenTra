<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>HAyDenTra® | المنتجات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none !important;
        }

        html {
            min-height: 100%;
            background: #ffffff;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100dvh;
            font-family: "Cairo", sans-serif;
            color: #1e3a8a;
            background: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        body.menu-open,
        body.modal-open {
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* =========================
           POP-UP ANIMATIONS
        ========================= */

        @keyframes appleGlassAppear {
            0% {
                opacity: 0;
                transform: scale(0.92) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .pop-element {
            animation: appleGlassAppear 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
            will-change: transform, opacity;
        }

        /* =========================
           HERO BG (PARALLAX ENHANCED)
        ========================= */

        .hero-bg-section {
            position: fixed;
            top: 74px;
            left: 0;
            width: 100%;
            height: 100vh;
            background: url("searchbarbg.jpg") center top / cover no-repeat;
            z-index: 0;
            pointer-events: none;
            will-change: transform;
            transition: transform 0.1s ease-out;
        }

        /* =========================
           NAVBAR (iOS GLASS)
        ========================= */

        .topbar {
            position: fixed;
            top: 0;
            right: 0;
            left: 0;
            height: 74px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.35);
            border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            box-shadow: 0 8px 32px rgba(2, 132, 199, 0.08);
        }

        .nav-inner {
            height: 100%;
            max-width: 1200px;
            margin: auto;
            padding: 0 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            direction: ltr;
        }

        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            direction: ltr;
        }

        .nav-logo-circle {
            width: 50px;
            height: 50px;
            flex-shrink: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.8);
            display: grid;
            place-items: center;
            border: 1px solid rgba(14, 165, 233, 0.3);
            box-shadow: 0 0 8px rgba(186, 230, 253, 0.8), 0 0 15px rgba(56, 189, 248, 0.2);
        }

        .nav-logo-circle img {
            width: 72%;
            height: 72%;
            object-fit: contain;
            border-radius: 50%;
        }

        .brand-name {
            position: relative;
            display: inline-block;
            font-family: Arial, sans-serif;
            font-size: 27px;
            line-height: 1;
            font-weight: 900;
            color: #0284c7;
            white-space: nowrap;
            direction: ltr;
        }

        .brand-name .registered {
            position: absolute;
            top: -7px;
            right: -9px;
            font-size: 10px;
            line-height: 1;
        }

        .menu-btn {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            color: #0284c7;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(186, 230, 253, 0.2);
            transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(1.04);
        }

        .overlay {
            position: fixed;
            inset: 0;
            z-index: 1050;
            background: rgba(15, 23, 42, 0.3);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            opacity: 0;
            visibility: hidden;
            transition: .35s ease;
        }

        .overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .sidebar {
            position: fixed;
            top: 0;
            right: 0;
            width: min(80%, 350px);
            height: 100dvh;
            z-index: 1100;
            padding: 28px 20px;
            background: rgba(255, 255, 255, 0.55);
            border-left: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            box-shadow: -10px 0 35px rgba(2, 132, 199, 0.15);
            transform: translateX(110%);
            transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1);
            overflow-y: auto;
        }

        .sidebar.active {
            transform: translateX(0);
        }

        .sidebar-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 25px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(186, 230, 253, 0.5);
        }

        .sidebar-logo {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 0 10px rgba(186, 230, 253, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
            border: 1px solid rgba(14, 165, 233, 0.2);
        }

        .sidebar-logo img {
            width: 72%;
            height: 72%;
            object-fit: contain;
            border-radius: 50%;
        }

        .sidebar-brand {
            position: relative;
            margin-top: 13px;
            font-family: Arial, sans-serif;
            font-size: 25px;
            font-weight: 900;
            direction: ltr;
            color: #0284c7;
        }

        .sidebar-brand .registered {
            position: absolute;
            top: -5px;
            right: -8px;
            font-size: 9px;
        }

        .close-btn {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.6);
            color: #0284c7;
            font-size: 20px;
            cursor: pointer;
            transition: .25s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.05);
        }

        .side-link {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 15px 16px;
            margin-bottom: 10px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            font-size: 16px;
            font-weight: 700;
            color: #0369a1;
            transition: .25s;
        }

        .side-link i {
            width: 25px;
            text-align: center;
            color: #0284c7;
        }

        .side-link:hover,
        .side-link.active {
            background: rgba(224, 242, 254, 0.6);
            border-color: #38bdf8;
            color: #0284c7;
        }

        /* =========================
           MAIN & PAGE HEADER
        ========================= */

        main {
            position: relative;
            z-index: 1;
            padding-top: 74px;
        }

        .page-header {
            text-align: center;
            padding: 40px 18px 25px;
        }

        .main-logo-circle {
            width: 95px;
            height: 95px;
            margin: 0 auto;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.85);
            display: grid;
            place-items: center;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.25), 0 0 35px rgba(56, 189, 248, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.9);
            outline: 1px solid rgba(14, 165, 233, 0.3);
        }

        .main-logo-circle img {
            width: 70%;
            height: 70%;
            object-fit: contain;
            border-radius: 50%;
        }

        .main-brand {
            position: relative;
            display: inline-block;
            margin-top: 18px;
            font-family: Arial, sans-serif;
            font-size: 40px;
            line-height: 1;
            font-weight: 900;
            direction: ltr;
            color: #0284c7;
            letter-spacing: .5px;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9);
        }

        .main-brand .registered {
            position: absolute;
            top: -6px;
            right: -10px;
            font-size: 13px;
        }

        .page-header h1 {
            margin-top: 18px;
            font-size: clamp(26px, 6vw, 38px);
            font-weight: 900;
            color: #0f172a;
            text-shadow: 0 1px 4px rgba(255, 255, 255, 0.9);
        }

        .page-header p {
            margin-top: 8px;
            color: #0369a1;
            font-size: 16px;
            font-weight: 800;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);
        }

        /* =========================
           CONTENT BODY WRAPPER (WHITE GRADIENT BLEND)
        ========================= */

        .content-body-wrapper {
            position: relative;
            z-index: 2;
            margin-top: 10px;
            padding-top: 30px;
            padding-bottom: 20px;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0) 0%,
                rgba(255, 255, 255, 0.45) 70px,
                rgba(255, 255, 255, 0.8) 140px,
                #ffffff 220px,
                #ffffff 100%
            );
        }

        /* =========================
           iOS GLASS FILTERS
        ========================= */

        .filters {
            width: min(100% - 24px, 1100px);
            margin: 0 auto 35px;
            padding: 22px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px) saturate(190%);
            -webkit-backdrop-filter: blur(25px) saturate(190%);
            box-shadow: 0 12px 35px rgba(2, 132, 199, 0.08), inset 0 1px 1px rgba(255, 255, 255, 0.9);
        }

        .filter-row {
            display: grid;
            grid-template-columns: 1fr 220px;
            gap: 12px;
        }

        .search-box,
        .sort-select {
            width: 100%;
            padding: 14px 18px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #0f172a;
            font-family: "Cairo", sans-serif;
            font-size: 15px;
            font-weight: 800;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.04);
            transition: .25s ease;
        }

        .search-box:focus,
        .sort-select:focus {
            border-color: #38bdf8;
            background: rgba(255, 255, 255, 0.85);
            box-shadow: 0 8px 25px rgba(2, 132, 199, 0.18);
        }

        .search-box::placeholder {
            color: #64748b;
            font-weight: 700;
        }

        .chips {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            overflow-x: auto;
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch;
        }

        .chip {
            flex-shrink: 0;
            padding: 9px 20px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: #0369a1;
            font-family: "Cairo", sans-serif;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: .25s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .chip:hover {
            background: rgba(224, 242, 254, 0.8);
            transform: translateY(-1px);
        }

        .chip.active {
            background: #0284c7;
            border-color: #0284c7;
            color: #ffffff;
            box-shadow: 0 6px 18px rgba(2, 132, 199, 0.35);
        }

        /* =========================
           NEW iOS GLASS PRODUCT CARDS
        ========================= */

        .products-grid {
            width: min(100% - 24px, 1100px);
            margin: 20px auto 50px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 22px;
        }

        .product-card {
            position: relative;
            overflow: hidden;
            border-radius: 28px;
            
            /* Enhanced iOS Liquid Glass Effect */
            background: rgba(255, 255, 255, 0.32);
            border: 1px solid rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(22px) saturate(200%);
            -webkit-backdrop-filter: blur(22px) saturate(200%);
            
            box-shadow: 0 15px 35px -5px rgba(2, 132, 199, 0.08), 
                        inset 0 1px 1px 0 rgba(255, 255, 255, 0.9),
                        inset 0 -1px 1px 0 rgba(2, 132, 199, 0.05);
                        
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), 
                        box-shadow 0.4s ease, 
                        border-color 0.3s ease, 
                        background 0.3s ease;
                        
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            cursor: pointer;
        }

        /* Glass light reflection highlight */
        .product-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 40%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.45) 0%, rgba(255, 255, 255, 0) 100%);
            pointer-events: none;
            border-radius: 28px 28px 0 0;
        }

        .product-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.55);
            border-color: rgba(56, 189, 248, 0.8);
            box-shadow: 0 22px 45px -8px rgba(2, 132, 199, 0.18), 
                        inset 0 1px 2px rgba(255, 255, 255, 1);
        }

        /* Transparent Glass Image Area */
        .product-image {
            height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.2);
            margin: 12px 12px 0 12px;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.6);
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 14px;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            mix-blend-mode: multiply; /* Blends image smoothly with white/glass bg */
        }

        .product-card:hover .product-image img {
            transform: scale(1.06);
        }

        .product-image i {
            font-size: 65px;
            color: #0284c7;
        }

        .product-info {
            padding: 18px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            position: relative;
            z-index: 1;
        }

        /* WHITE & CLEAR CATEGORY TEXT */
        .product-category {
            color: #ffffff !important;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .4px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 0 10px rgba(2, 132, 199, 0.5);
            display: inline-block;
        }

        .product-name {
            margin-top: 6px;
            font-size: 17px;
            line-height: 1.45;
            font-weight: 900;
            color: #0f172a;
        }

        .product-description {
            margin-top: 8px;
            color: #334155;
            font-size: 12px;
            line-height: 1.6;
            font-weight: 600;

            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 18px;
            padding-top: 12px;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* WHITE & CLEAR PRICE TEXT */
        .price {
            font-size: 18px;
            font-weight: 900;
            color: #ffffff !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4), 0 0 12px rgba(2, 132, 199, 0.6);
            background: rgba(2, 132, 199, 0.35);
            padding: 4px 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .order-btn {
            border: 0;
            padding: 10px 16px;
            border-radius: 14px;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: #ffffff;
            font-family: "Cairo", sans-serif;
            font-size: 12px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.28);
            transition: .3s cubic-bezier(0.16, 1, 0.3, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
        }

        .order-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.42);
        }

        /* =========================
           NEW iOS GLASS PRODUCT MODAL (POP-UP)
        ========================= */

        .product-modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 2000;
            background: rgba(15, 23, 42, 0.35);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s ease;
        }

        .product-modal-backdrop.active {
            opacity: 1;
            visibility: visible;
        }

        .product-modal-card {
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border-radius: 32px;
            width: min(100%, 480px);
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25), inset 0 1px 2px rgba(255, 255, 255, 0.9);
            position: relative;
            transform: scale(0.9) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .product-modal-backdrop.active .product-modal-card {
            transform: scale(1) translateY(0);
        }

        .modal-close-btn {
            position: absolute;
            top: 18px;
            left: 18px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.6);
            color: #0284c7;
            font-size: 18px;
            display: grid;
            place-items: center;
            cursor: pointer;
            transition: 0.25s;
            z-index: 10;
        }

        .modal-close-btn:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: scale(1.08);
        }

        .modal-product-img {
            width: 100%;
            height: 240px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 15px;
            box-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.7);
        }

        .modal-product-img img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply;
        }

        .modal-product-category {
            margin-top: 16px;
            font-size: 14px;
            font-weight: 800;
            color: #ffffff !important;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 0 10px rgba(2, 132, 199, 0.5);
            display: inline-block;
        }

        .modal-product-title {
            margin-top: 4px;
            font-size: 22px;
            font-weight: 900;
            color: #0f172a;
        }

        .modal-product-desc {
            margin-top: 10px;
            font-size: 14px;
            color: #334155;
            line-height: 1.6;
            font-weight: 600;
        }

        .modal-product-bottom {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 22px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.6);
        }

        .modal-product-price {
            font-size: 20px;
            font-weight: 900;
            color: #ffffff !important;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.4), 0 0 12px rgba(2, 132, 199, 0.6);
            background: rgba(2, 132, 199, 0.35);
            padding: 5px 12px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        /* Responsive Layout Grid */
        @media (max-width: 992px) {
            .products-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 640px) {
            .products-grid {
                grid-template-columns: 1fr;
            }
            .filter-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- HERO BACKGROUND WITH PARALLAX EFFECT -->
    <div class="hero-bg-section" id="heroBg"></div>

    <!-- NAVBAR -->
    <header class="topbar">
        <div class="nav-inner">
            <button class="menu-btn" id="openMenu" aria-label="القائمة">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="nav-brand">
                <div class="nav-logo-circle">
                    <img src="logo.png" alt="HAyDenTra® Logo">
                </div>
                <span class="brand-name">HAyDenTra<span class="registered">®</span></span>
            </div>
        </div>
    </header>

    <!-- SIDEBAR OVERLAY -->
    <div class="overlay" id="overlay"></div>

    <!-- SIDEBAR MENU -->
    <aside class="sidebar" id="sidebar">

        <a href="index.html" class="side-link">

        </a>

        </section>

        <div class="content-body-wrapper">
            <!-- FILTERS -->
            <section class="filters pop-element">
                <div class="filter-row">
                    <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم المنتج أو النوع...">
                    <select id="sortSelect" class="sort-select">
                        <option value="default">الترتيب الافتراضي</option>
                        <option value="price-asc">السعر: من الأقل للأعلى</option>

                    </select>

                    <!-- Categories will load dynamically -->

    <!-- POP-UP PRODUCT MODAL (GLASS) -->
    <div class="product-modal-backdrop" id="productModal">

                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="modal-product-img" id="modalImgContainer">
                <img id="modalImg" src="" alt="صورة المنتج">
            </div>
            <span class="modal-product-category" id="modalCategory">الفئة</span>
            <h2 class="modal-product-title" id="modalTitle">اسم المنتج</h2>
            <p class="modal-product-desc" id="modalDesc">تفاصيل المنتج ووصفه كاملاً يظهر هنا في هذه النافذة الزجاجية المميزة.</p>
            <div class="modal-product-bottom">
                <span class="modal-product-price" id="modalPrice">0 ج.م</span>
                <button class="order-btn" id="modalOrderBtn">
                    <i class="fa-solid fa-cart-shopping"></i> طلب المنتج
                </button>
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT & LOGIC -->
    <script>
        // Interactive Menu Toggle
        const openMenu = document.getElementById('openMenu');
        const closeMenu = document.getElementById('closeMenu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');

        function toggleSidebar(show) {
            if (show) {
                sidebar.classList.add('active');
                overlay.classList.add('active');
                document.body.classList.add('menu-open');
            } else {
                sidebar.classList.remove('active');
                overlay.classList.remove('active');
                document.body.classList.remove('menu-open');
            }
        }

        openMenu.addEventListener('click', () => toggleSidebar(true));
        closeMenu.addEventListener('click', () => toggleSidebar(false));
        overlay.addEventListener('click', () => toggleSidebar(false));

        // Parallax Effect for Background
        window.addEventListener('scroll', () => {
            const scrolled = window.scrollY;
            const heroBg = document.getElementById('heroBg');
            if (heroBg) {
                heroBg.style.transform = `translateY(${scrolled * 0.25}px)`;
            }
        });

        // Modal Controls
        const productModal = document.getElementById('productModal');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        function closeModal() {
            productModal.classList.remove('active');
            document.body.classList.remove('modal-open');
        }

        modalCloseBtn.addEventListener('click', closeModal);
        productModal.addEventListener('click', (e) => {
            if (e.target === productModal) closeModal();
        });
    </script>
</body>
