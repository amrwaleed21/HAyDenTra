<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAyDenTra® | المنتجات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Plus+Jakarta+Sans:wght@700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            min-height: 100vh;
            font-family: "Cairo", sans-serif;
            color: #0f2d4a;
            background: radial-gradient(circle at 50% 10%, #e0f2fe 0%, #f0f9ff 45%, #ffffff 100%);
            background-attachment: fixed;
            overflow-x: hidden;
        }
        body.menu-open { overflow: hidden; }
        a { text-decoration: none; color: inherit; }

        /* Topbar & Blur Glass */
        .topbar {
            position: fixed; top: 0; right: 0; left: 0; height: 74px; z-index: 1000;
            background: rgba(255, 255, 255, 0.65);
            border-bottom: 1px solid rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(16px) saturate(180%);
            -webkit-backdrop-filter: blur(16px) saturate(180%);
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.08);
        }
        .nav-inner {
            height: 100%; max-width: 1200px; margin: auto; padding: 0 20px;
            display: flex; align-items: center; justify-content: space-between; direction: ltr;
        }
        .nav-brand { display: flex; align-items: center; gap: 12px; direction: ltr; }
        .nav-logo-circle {
            width: 50px; height: 50px; flex-shrink: 0; border-radius: 50%; background: #ffffff;
            display: grid; place-items: center; border: 2px solid #e0f2fe;
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.15);
        }
        .nav-logo-circle img { width: 75%; height: 75%; object-fit: contain; }
        .brand-name {
            position: relative; display: inline-block; font-family: 'Plus Jakarta Sans', Arial, sans-serif;
            font-weight: 900; font-size: 26px; line-height: 1; color: #0284c7; white-space: nowrap;
        }
        .brand-name .registered { position: absolute; top: -6px; right: -9px; font-size: 10px; font-weight: 800; color: #0369a1; }
        .menu-btn {
            width: 52px; height: 52px; border-radius: 16px; border: 1px solid rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); color: #0284c7;
            font-size: 24px; display: flex; align-items: center; justify-content: center; cursor: pointer;
            transition: .3s;
        }
        .menu-btn:hover { background: #ffffff; }

        /* Sidebar Glass */
        .overlay {
            position: fixed; inset: 0; z-index: 1050; background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(4px); opacity: 0; visibility: hidden; transition: .3s;
        }
        .overlay.active { opacity: 1; visibility: visible; }
        .sidebar {
            position: fixed; top: 0; right: 0; width: min(80%, 340px); height: 100dvh; z-index: 1100;
            padding: 30px 22px; background: rgba(255, 255, 255, 0.82); border-left: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(25px) saturate(190%); box-shadow: -15px 0 45px rgba(2, 132, 199, 0.12);
            transform: translateX(110%); transition: transform .4s cubic-bezier(0.16, 1, 0.3, 1); overflow-y: auto;
        }
        .sidebar.active { transform: translateX(0); }
        .close-btn { position: absolute; top: 20px; left: 20px; width: 40px; height: 40px; border-radius: 50%; border: none; background: #e0f2fe; color: #0284c7; font-size: 18px; cursor: pointer; }
        .sidebar-header { display: flex; flex-direction: column; align-items: center; padding-bottom: 25px; margin-bottom: 25px; border-bottom: 1px solid #e0f2fe; }
        .sidebar-logo { width: 70px; height: 70px; border-radius: 50%; background: #ffffff; display: grid; place-items: center; border: 2px solid #e0f2fe; }
        .sidebar-logo img { width: 75%; height: 75%; object-fit: contain; }
        .sidebar-brand { margin-top: 12px; position: relative; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 900; color: #0284c7; direction: ltr; }
        .side-link { display: flex; align-items: center; gap: 14px; padding: 14px 18px; margin-bottom: 12px; border-radius: 16px; background: rgba(255,255,255,0.6); border: 1px solid rgba(224, 242, 254, 0.8); font-size: 16px; font-weight: 700; color: #0369a1; transition: .3s; }
        .side-link i { width: 24px; text-align: center; color: #0284c7; }
        .side-link:hover, .side-link.active { background: #0284c7; color: #ffffff; }
        .side-link:hover i, .side-link.active i { color: #ffffff; }

        /* Main Page Header */
        main { padding-top: 74px; }
        .page-header { text-align: center; padding: 40px 20px 15px; }
        .page-header h1 { font-size: clamp(26px, 5vw, 38px); font-weight: 900; color: #0c4a6e; }
        .page-header p { margin-top: 8px; color: #0284c7; font-size: 16px; font-weight: 600; }

        /* Filters section */
        .filters {
            width: min(100% - 30px, 1000px); margin: 20px auto; padding: 20px; border-radius: 24px;
            background: rgba(255, 255, 255, 0.75); border: 1px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px); box-shadow: 0 10px 30px rgba(14, 165, 233, 0.05);
            animation: popUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .filter-row { display: grid; grid-template-columns: 1fr 180px; gap: 12px; }
        .search-box, .sort-select {
            width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid #bae6fd;
            background: rgba(255, 255, 255, 0.9); color: #0f172a; font-family: "Cairo", sans-serif;
            font-size: 14px; outline: none;
        }
        .chips { display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; padding-bottom: 4px; }
        .chip {
            flex-shrink: 0; padding: 8px 18px; border-radius: 50px; border: 1px solid #bae6fd;
            background: rgba(255,255,255,0.8); color: #0369a1; font-family: "Cairo", sans-serif;
            font-size: 13px; font-weight: 700; cursor: pointer; transition: .25s;
        }
        .chip.active, .chip:hover { background: #0284c7; color: #ffffff; border-color: #0284c7; }

        /* Products Grid & PopUp Card Effect */
        .products-grid {
            width: min(100% - 30px, 1100px); margin: 25px auto 50px;
            display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px;
        }
        .product-card {
            overflow: hidden; border-radius: 26px; background: rgba(255, 255, 255, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 12px 35px rgba(14, 165, 233, 0.08);
            backdrop-filter: blur(10px); transition: .35s cubic-bezier(0.16, 1, 0.3, 1);
            animation: popUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-card:hover { transform: translateY(-6px) scale(1.02); background: #ffffff; box-shadow: 0 20px 45px rgba(14, 165, 233, 0.16); }
        
        .product-image {
            height: 200px; display: flex; align-items: center; justify-content: center;
            background: #f0f9ff; overflow: hidden; border-bottom: 1px solid #e0f2fe;
        }
        .product-image img { width: 100%; height: 100%; object-fit: cover; }
        .product-image i { font-size: 60px; color: #38bdf8; }

        .product-info { padding: 20px; flex-grow: 1; display: flex; flex-direction: column; }
        .product-category { color: #0284c7; font-size: 12px; font-weight: 800; text-transform: uppercase; }
        .product-name { margin-top: 6px; font-size: 18px; font-weight: 800; color: #0c4a6e; line-height: 1.4; }
        .product-description { margin-top: 8px; color: #64748b; font-size: 13px; line-height: 1.7; flex-grow: 1; }

        .product-bottom { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 20px; }
        .price { font-size: 19px; font-weight: 900; color: #0369a1; }
        
        .order-btn {
            border: none; padding: 10px 16px; border-radius: 14px;
            background: linear-gradient(135deg, #25d366, #128c7e); color: #ffffff;
            font-family: "Cairo", sans-serif; font-size: 13px; font-weight: 800;
            cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.25); transition: .25s;
            text-decoration: none;
        }
        .order-btn:hover { transform: scale(1.05); background: linear-gradient(135deg, #22c35e, #0e7266); }

        .loading, .no-results { text-align: center; color: #0284c7; font-weight: 700; padding: 40px; grid-column: 1 / -1; }

        footer {
            width: 100%; padding: 22px 15px; text-align: center; color: #64748b; font-size: 13px;
            background: rgba(255, 255, 255, 0.6); border-top: 1px solid rgba(224, 242, 254, 0.8);
        }

        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.88) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @media(max-width: 600px) {
            .filter-row { grid-template-columns: 1fr; }
            .products-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header class="topbar">
        <div class="nav-inner">
            <div class="nav-brand">
                <div class="nav-logo-circle">
                    <img src="logo.png" alt="HAyDenTra Logo">
                </div>
                <div class="brand-name"> HAyDenTra <span class="registered">®</span> </div>
            </div>
            <button class="menu-btn" onclick="openMenu()"><i class="fa-solid fa-bars"></i></button>
        </div>
    </header>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="closeMenu()"><i class="fa-solid fa-xmark"></i></button>
        <div class="sidebar-header">
            <div class="sidebar-logo"><img src="logo.png" alt="HAyDenTra Logo"></div>
            <div class="sidebar-brand">HAyDenTra <span class="registered">®</span></div>
        </div>
        <a href="index.html" class="side-link"><i class="fa-solid fa-house"></i> <span>الرئيسية</span></a>
        <a href="products.html" class="side-link active"><i class="fa-solid fa-tooth"></i> <span>المنتجات</span></a>
        <a href="contact.html" class="side-link"><i class="fa-solid fa-phone"></i> <span>تواصل معنا</span></a>
    </aside>

    <main>
        <section class="page-header">
            <h1>منتجات ومستلزمات الأسنان</h1>
            <p>مجموعة مختارة من المواد والأجهزة والأدوات الطبية</p>
        </section>

        <section class="filters">
            <div class="filter-row">
                <input type="text" id="searchInput" class="search-box" placeholder="ابحث عن منتج...">
                <select id="sortSelect" class="sort-select">
                    <option value="default">ترتيب المنتجات</option>
                    <option value="high">السعر: من الأعلى للأقل</option>
                    <option value="low">السعر: من الأقل للأعلى</option>
                </select>
            </div>
            <div class="chips">
                <button class="chip active" data-category="all">الكل</button>
                <button class="chip" data-category="materials">المواد</button>
                <button class="chip" data-category="devices">الأجهزة</button>
                <button class="chip" data-category="tools">الأدوات</button>
            </div>
        </section>

        <section class="products-grid" id="productsGrid">
            <div class="loading" id="loading">جاري تحميل المنتجات...</div>
        </section>
        <div class="no-results" id="noResults" style="display:none;">لا توجد منتجات مطابقة للبحث.</div>
    </main>

    <footer> © 2026 HAyDenTra® - جميع الحقوق محفوظة </footer>

    <script>
        const phone = "201223859088"; // رقم الواتساب المعتمد للطلب
        
        // إعداد Supabase المباشر بنفس منطق الكود الاصلي
        const SUPABASE_URL = "YOUR_SUPABASE_URL"; 
        const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";
        let supabaseClient = null;
        if(window.supabase) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        let allProducts = [];
        let currentCategory = 'all';

        async function fetchProducts() {
            if(!supabaseClient) {
                // نماذج تجريبية في حالة عدم توفر مفاتيح Supabase
                allProducts = [
                    { id: 1, name: "مادة كومبوزيت أصلية", price: 2450, category: "materials", description: "حشوات تجميلية فائقة الجودة والمتانة.", image_url: "" },
                    { id: 2, name: "جهاز تبييض الأسنان", price: 8500, category: "devices", description: "جهاز ضوئي متطور لتبييض الاحترافي.", image_url: "" }
                ];
                renderProducts(allProducts);
                return;
            }
            try {
                const { data, error } = await supabaseClient.from('products').select('*');
                if (error) throw error;
                allProducts = data || [];
                renderProducts(allProducts);
            } catch (err) {
                console.error("خطأ في الجلب:", err);
                document.getElementById('productsGrid').innerHTML = '<div class="loading">عذراً، حدث خطأ أثناء تحميل المنتجات.</div>';
            }
        }

        function renderProducts(products) {
            const grid = document.getElementById('productsGrid');
            const noResults = document.getElementById('noResults');
            
            if (products.length === 0) {
                grid.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            grid.innerHTML = products.map(p => {
                // إعداد نص الرسالة وتوجيه الطلب مباشرة للواتساب
                const message = encodeURIComponent(`مرحباً HAyDenTra®، أود الاستفسار وطلب المنتج التالي:\n- اسم المنتج: ${p.name}\n- السعر: ${p.price} ج.م`);
                const whatsappUrl = `https://wa.me/${phone}?text=${message}`;

                return `
                    <div class="product-card">
                        <div class="product-image">
                            ${p.image_url ? `<img src="${p.image_url}" alt="${p.name}">` : `<i class="fa-solid fa-tooth"></i>`}
                        </div>
                        <div class="product-info">
                            <span class="product-category">${p.category || 'عام'}</span>
                            <h3 class="product-name">${p.name}</h3>
                            <p class="product-description">${p.description || 'لا يوجد وصف متوفر.'}</p>
                            <div class="product-bottom">
                                <span class="price">${p.price} ج.م</span>
                                <a href="${whatsappUrl}" target="_blank" class="order-btn">
                                    <i class="fa-brands fa-whatsapp"></i> طلب الآن
                                </a>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Sidebar Actions
        function openMenu() {
            document.getElementById("sidebar").classList.add("active");
            document.getElementById("overlay").classList.add("active");
            document.body.classList.add("menu-open");
        }
        function closeMenu() {
            document.getElementById("sidebar").classList.remove("active");
            document.getElementById("overlay").classList.remove("active");
            document.body.classList.remove("menu-open");
        }

        // Filter Logic
        document.addEventListener('DOMContentLoaded', () => {
            fetchProducts();

            document.getElementById('searchInput').addEventListener('input', filterAndSort);
            document.getElementById('sortSelect').addEventListener('change', filterAndSort);

            document.querySelectorAll('.chip').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
                    e.target.classList.add('active');
                    currentCategory = e.target.getAttribute('data-category');
                    filterAndSort();
                });
            });
        });

        function filterAndSort() {
            let result = [...allProducts];
            const searchValue = document.getElementById('searchInput').value.trim().toLowerCase();
            const sortValue = document.getElementById('sortSelect').value;

            if (currentCategory !== 'all') {
                result = result.filter(p => p.category === currentCategory);
            }

            if (searchValue) {
                result = result.filter(p => p.name.toLowerCase().includes(searchValue) || (p.description && p.description.toLowerCase().includes(searchValue)));
            }

            if (sortValue === 'high') {
                result.sort((a, b) => b.price - a.price);
            } else if (sortValue === 'low') {
                result.sort((a, b) => a.price - b.price);
            }

            renderProducts(result);
        }
    </script>
</body>
</html>
